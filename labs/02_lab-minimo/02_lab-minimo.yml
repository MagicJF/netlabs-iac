---
# PROPÓSITO:   declarar la topología más pequeña que el motor puede converger:
#              un bridge y un contenedor.
# INVARIANTES: usa el MISMO vocabulario de roles y las mismas secciones que
#              cualquier otro lab -- el motor no tiene un túnel especial para
#              los labs pequeños. No declara vmid ni MAC (regla 4.8).
# LÍMITES:     no tiene VM, así que no ejercita la rama QEMU del plan; para eso
#              está el otro lab de ejemplo.
# VER:         labs/02_lab-minimo/02_lab-minimo.md; README.md §Identidad
#
# POR QUÉ EXISTE: es la prueba de que el motor no conoce ningún lab. Los mismos
# verbos, sin tocar una línea de `deployment_engine/`, producen otro plan; y los
# conjuntos declarados por los dos labs de ejemplo son disjuntos, que es lo que
# vigila `./lab check colisiones`.
#
# QUÉ SUSTITUIR para un Proxmox real: las direcciones, que están en 198.51.100.0/24
# (rango reservado para documentación, RFC 5737, inexistente en la realidad). El
# nombre del bridge ya es uno que el núcleo acepta (sin guiones, ≤15 caracteres).
#
# EL NOMBRE de sus invitados no lleva el lab (ADR 0015): dice QUÉ ES. Aquí hay un
# puesto de trabajo (`tipo: ws`) que, al ser el número 1, se llama `ws-1` en Proxmox.

lab:
  nombre: 02_lab-minimo

  stages: [1]

  bridges:
    - nombre: vmb_lab_minimo
      address: 198.51.100.1/24

containers:
  - rol: workstation-1
    tipo: ws          # un puesto de trabajo -> el nombre empieza por 'ws-'
    nombre: 1         # ...y como es el 1, en Proxmox se llama 'ws-1'
    stage: 1
    cores: 1
    memory: 256
    disk: 4
    bridge: vmb_lab_minimo
    address: 198.51.100.11/24
