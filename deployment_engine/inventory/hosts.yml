---
# PROPÓSITO:   el inventario del motor. Un solo host: el nodo Proxmox visto como
#              host LOCAL que habla con su API REST.
# INVARIANTES: el host se ejecuta con `ansible_connection: local`. El motor NUNCA
#              abre una conexión SSH al hipervisor (regla 1); por eso el host no
#              tiene `ansible_host` ni usuario ni clave.
# LÍMITES:     la URL, el puerto y el token NO están aquí: los pone
#              `deployment_engine/secrets.yml`, que es de esta máquina y no se
#              versiona. Este fichero no cambia entre labs ni entre entornos.
# VER:         README.md §Arquitectura; docs/decisiones/0001-solo-api-de-proxmox.md
all:
  hosts:
    # El nombre es el papel, no la máquina: el nodo real lo dice `secrets.yml`.
    proxmox_api:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
