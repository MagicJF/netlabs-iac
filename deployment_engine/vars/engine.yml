---
# PROPÓSITO:   los valores por defecto del MOTOR: lo que es igual para cualquier
#              lab y para cualquier Proxmox. Nada de ningún lab concreto (regla 4.7).
# INVARIANTES: aquí no puede aparecer el nombre de un lab, ni una banda de vmids,
#              ni el nombre de un bridge. Lo comprueba `./lab check pureza-lab`.
# LÍMITES:     no son credenciales (esas van en secrets.yml) ni topología (esa va
#              en la declaración del lab).
# VER:         README.md §Identidad asignada; AGENTS.md §Identidad

# --- Identidad ------------------------------------------------------------
# Prefijo de la MAC derivada. Los 3 bytes bajos los pone el vmid: la MAC es
# función pura del vmid, así que no se guarda ni se declara nunca (regla 4.8).
# El prefijo BC:24:11 es el OUI que Proxmox documenta para MACs generadas.
engine_prefijo_mac: "BC:24:11"

# Primer vmid que el asignador puede usar. Por debajo de 100 Proxmox reserva
# rangos para sí mismo.
engine_vmid_minimo: 100

# Último vmid que el asignador puede usar. Es lo que convierte "el menor libre"
# en una búsqueda finita: si no queda ninguno por debajo de este tope, el
# asignador FALLA con un mensaje claro en vez de reasignar en silencio.
engine_vmid_maximo: 999999

# Plantilla del sistema para crear un contenedor. Un LXC no se puede crear sin
# ella, y no es un valor de ningún lab: es del ENTORNO (qué plantillas hay en el
# almacenamiento del nodo). Por eso vive aquí y no en la declaración.
engine_ostemplate_lxc: "local:vztmpl/CAMBIAME.tar.zst"

# Nombre del nodo que se usa cuando NO hay credenciales: `plan` sin `--api`
# planifica contra un clúster vacío simulado, y las rutas REST necesitan un nombre
# de nodo. No es un valor de ningún lab ni de ningún Proxmox real: es el nombre del
# mundo simulado, y por eso aparece tal cual en los planes offline.
engine_nodo_simulado: "nodo-simulado"

# Plantilla de la descripción que el motor escribe en cada invitado. Es la
# segunda mitad de la frontera de propiedad: el pool dice "es de este lab" y la
# descripción dice "es este rol". Sin ella no se puede reconstruir rol→vmid
# leyendo la API.
engine_plantilla_descripcion: "lab={lab} rol={rol} gestionado por netlabs_v4_b"

# Plantilla del nombre canónico de un invitado: <nombre-lab>-<rol>.
engine_plantilla_nombre: "{lab}-{rol}"

# --- Puerta de la API -----------------------------------------------------
# Segundos que se espera una respuesta antes de dar la llamada por perdida.
engine_timeout_api: 30

# Tamaño máximo, en caracteres, del cuerpo de la respuesta que se guarda en el
# diario. El diario es prueba de lo ocurrido, no una copia del cluster.
engine_diario_max_cuerpo: 2000

# --- Logs -----------------------------------------------------------------
# Cuántos informes `verify-*.json` se conservan por lab. Los más viejos se
# borran al escribir uno nuevo: el log rota, no crece sin fin.
engine_retencion_informes: 10
