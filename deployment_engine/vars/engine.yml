---
# PROPÓSITO:   los valores por defecto del MOTOR: lo que es igual para cualquier
#              lab y para cualquier Proxmox. Nada de ningún lab concreto (regla 7).
# INVARIANTES: aquí no puede aparecer el nombre de un lab, ni una banda de vmids,
#              ni el nombre de un bridge. Lo comprueba `./lab check pureza-lab`.
# LÍMITES:     no son credenciales (esas van en secrets.yml) ni topología (esa va
#              en la declaración del lab).
# VER:         README.md §Identidad: quién pone los números; AGENTS.md §Identidad: quién pone los números

# --- Identidad ------------------------------------------------------------
# Prefijo de la MAC derivada. Los 3 bytes bajos los pone el vmid: la MAC es
# función pura del vmid, así que no se guarda ni se declara nunca (regla 11).
# El prefijo BC:24:11 es el OUI que Proxmox documenta para MACs generadas.
engine_prefijo_mac: "BC:24:11"

# Primer vmid que el asignador puede usar. Por debajo de 100 Proxmox reserva
# rangos para sí mismo.
engine_vmid_minimo: 100

# Último vmid que el asignador puede usar. Es lo que convierte "el menor libre"
# en una búsqueda finita: si no queda ninguno por debajo de este tope, el
# asignador FALLA con un mensaje claro en vez de reasignar en silencio.
engine_vmid_maximo: 999999

# Plantilla del sistema para crear un contenedor. Un LXC no se puede crear sin
# ella, y no es un valor de ningún lab: es del ENTORNO (qué plantillas hay en el
# almacenamiento del nodo). Por eso vive aquí y no en la declaración.
engine_ostemplate_lxc: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"

# Almacenamiento donde vive la IMAGEN DE FÁBRICA que una VM importa al nacer. Se
# importa con `import-from` SÓLO al crear (§9.3), así que el almacenamiento tiene que
# ofrecer el contenido `import`. Es del ENTORNO --qué hay en el nodo--, no de ningún
# lab: el lab declara el NOMBRE del fichero, no dónde está.
engine_almacenamiento_imagen: "local"

# Nombre del nodo que se usa cuando NO hay credenciales: `plan` sin `--api`
# planifica contra un clúster vacío simulado, y las rutas REST necesitan un nombre
# de nodo. No es un valor de ningún lab ni de ningún Proxmox real: es el nombre del
# mundo simulado, y por eso aparece tal cual en los planes offline.
engine_nodo_simulado: "nodo-simulado"

# Plantilla de la descripción que el motor escribe en cada invitado. Es la
# segunda mitad de la frontera de propiedad: el pool dice "es de este lab" y la
# descripción dice "es este rol". Sin ella no se puede reconstruir rol→vmid
# leyendo la API.
engine_plantilla_descripcion: "lab={lab} rol={rol} gestionado por netlabs_v4_b"

# Plantilla del nombre de un invitado: el nombre dice QUÉ ES, no de qué lab es (ADR 0015).
# `{equipo}` es el `tipo:` que declara el lab (rt/srv/ws/sw/ctl) y `{alias}`, el `nombre:`
# corto si lo declara, o su rol si no. La MAC y la descripción siguen llevando el lab: el
# nombre es para leerlo, la propiedad (pool + descripción) es para el motor.
engine_plantilla_nombre: "{equipo}-{alias}"

# Marca que el motor escribe en el `comments` de un bridge que CREA él. Es la
# TERCERA mitad de la frontera de propiedad, y existe por un hueco concreto: un
# invitado se puede probar con el pool, pero Proxmox NO mete interfaces de red en
# ningún pool, así que para un bridge no hay frontera que valga. Sin esta marca,
# `destroy` no puede distinguir "lo creó este lab" de "ya estaba en el nodo cuando
# el lab llegó" (el plan sólo crea el bridge si falta) — y en esa duda no se borra.
# La escribe `plan` al crear el bridge y la lee `destroy` antes de borrarlo.
engine_plantilla_comentario_bridge: "lab={lab} gestionado por netlabs_v4_b"

# --- Vía de acceso a la API -----------------------------------------------------
# Segundos que se espera una respuesta antes de que la llamada se dé por perdida.
engine_timeout_api: 30
# Cuánto se espera a que un invitado conteste al SSH del motor (por el túnel). Es más
# corto que el de la API a propósito: si el túnel no está, no se espera un minuto a
# que se cumpla un imposible -- se dice que el túnel no está en pie.
engine_timeout_ssh: 15
# El puerto del sshd DENTRO de un invitado. No es un valor de ningún lab: es el puerto
# por el que escucha un invitado Linux y lo sabe todo el mundo.
engine_puerto_ssh_guest: 22
# El usuario con el que el motor entra en un invitado Linux. Es `root` porque es como
# Proxmox crea los contenedores que el motor despliega: no hay usuario de laboratorio
# que elegir, y el interior de un equipo de un lab se configura entero. NO es el usuario
# del túnel hacia casa (`pve_tunnel_usuario`, que es el de la máquina donde corre el motor):
# son dos cosas distintas y confundirlas da «Permission denied» al entrar.
engine_usuario_guest: root

# --- RouterOS (un invitado que se configura por su REST) -------------------
# El usuario del motor en un RouterOS, y lo que trae de fábrica. No son valores de
# ningún lab: son hechos del equipo (medidos en un CHR 7.25.1: trae el usuario `admin`
# SIN contraseña y sin ninguna clave). El usuario del motor coincide con el de fábrica
# -- el motor no crea un usuario aparte, le PONE su credencial al que ya está --, así
# que lo que cambia de verdad es la contraseña, y esa vive en `secrets.yml`
# (`routeros_clave`): es del entorno, no del equipo.
engine_routeros_usuario: admin
engine_routeros_clave_fabrica: ""

# --- Privilegios: lo que el motor EXIGE y lo que VEDA ---------------------
# No son valores del entorno: son la lista de lo que el motor necesita hacer y de lo
# que nunca debe poder hacer. Van POR ROL, y un rol por RUTA: conceder un solo rol en
# cinco rutas da la UNIÓN de todo en todas partes (medido: así estaba el nodo, y en
# `/vms` el token tenía además `Sys.Modify` y `Datastore.AllocateSpace`, que no pinta
# nada ahí). `guardia_privilegios.yml` lee lo que el nodo tiene concedido y lo compara
# con este mapa, rol a rol, y además hace sobre CADA rol la OPERACIÓN NULA (PUT con la
# misma lista de privilegios) exigiendo un 403: un mínimo privilegio que no se prueba
# es una intención. El detalle de por qué cada privilegio está donde está, y los
# comandos `pveum` que crean esto, en docs/decisiones/0004.
#
# Los NOMBRES de los roles son los del nodo; si el operador los llama de otro modo, se
# cambian aquí (una línea) y en las ACLs del nodo. El motor no los concede: los vigila.
#
# `VM.Console` está en el rol de `/vms` porque el motor entra UNA vez por la consola de
# un invitado para poner en marcha el túnel (§El túnel). Sin él, el motor no puede
# salir de casa hacia la red del lab; con él, root dentro de un invitado Linux es root
# DENTRO de ese invitado -- y por eso todo invitado nace `unprivileged` (check
# `privilegios`).
engine_privilegios_por_rol:
  # Crear, configurar, arrancar, copiar y ENTRAR POR CONSOLA (dentro de un invitado).
  NetlabsMotorVms:
    - VM.Allocate
    - VM.Config.CDROM
    - VM.Config.CPU
    - VM.Config.Cloudinit
    - VM.Config.Disk
    - VM.Config.HWType
    - VM.Config.Memory
    - VM.Config.Network
    - VM.Config.Options
    - VM.PowerMgmt
    - VM.Audit
    - VM.Snapshot
    - VM.Snapshot.Rollback
    - VM.Backup
    - VM.Console
    # El canal de LECTURA del invitado hacia el hipervisor (ADR 0011): es lo que deja al
    # motor saber las interfaces de una VM QEMU, que su config no declara. Sólo Audit
    # --lecturas y `ping`--; el resto de `VM.GuestAgent.*` sigue vedado, más abajo.
    - VM.GuestAgent.Audit
  # El pool es la frontera de propiedad del lab (regla: el pool se llama como el lab).
  NetlabsMotorPool:
    - Pool.Allocate
    - Pool.Audit
  # Los bridges del nodo y su red: `Sys.Modify` AQUÍ, nunca en `/`.
  NetlabsMotorNodo:
    - Sys.Modify
    - Sys.Audit
  # Los discos (y, en el roadmap, la plantilla del aparato).
  NetlabsMotorAlmacen:
    - Datastore.AllocateSpace
    - Datastore.AllocateTemplate
    - Datastore.Audit
  # Las redes virtuales que ya se usan.
  NetlabsMotorSdn:
    - SDN.Use
    - SDN.Audit

# Lo que el token del motor NO puede tener. `Sys.Modify` sobre la ruta de
# administración de permisos es el importante: con él, el token reescribe su propio
# rol (la llamada que escribe un rol sólo exige ese privilegio) y se concede
# cualquier cosa en una sola llamada. Con `Permissions.Modify` haría lo mismo sobre
# otros. `Sys.Console` daría consola en el NODO, que es justo lo que el motor no
# necesita: su consola es la de un INVITADO, y por eso basta `VM.Console`.
# `Datastore.Allocate` permite crear y borrar almacenamientos. Y de `VM.GuestAgent.*` se
# veda todo MENOS `Audit` (que está arriba, en el rol de `/vms`): `FileRead`, `FileWrite`,
# `FileSystemMgmt` y `Unrestricted` SÍ serían un túnel al interior que no pasa por las
# vías de acceso del motor (regla 12) -- leer y escribir ficheros dentro de un invitado,
# congelarle el sistema de ficheros o ejecutar programas dentro (medido en el código de
# PVE del nodo: `exec` pide `Unrestricted`). `Audit` no es eso: cubre lecturas y `ping`,
# y se pide a la API por la VÍA DE ACCESO, con su línea en el diario. Es lo que deja al motor
# VER las direcciones de una VM QEMU, que hoy le son invisibles (ADR 0011).
engine_privilegios_vedados:
  - Permissions.Modify
  - Sys.Console
  - Datastore.Allocate
  - VM.GuestAgent.FileRead
  - VM.GuestAgent.FileWrite
  - VM.GuestAgent.FileSystemMgmt
  - VM.GuestAgent.Unrestricted

# --- El túnel ------------------------------------------------------------
# El bastión (ver §El túnel y docs/tunnel-del-bastion.md).
# Nombre del rol del invitado que es el bastión. Es vocabulario del
# MOTOR: cualquier lab que declare un túnel tendrá un invitado con este rol.
engine_rol_control: "control"
# El `config:` con esta clave es el bastión: en vez de un interior que
# se converge por SSH, lo que se le pide es que SEPA salir hacia casa.
engine_clave_tunnel: "tunnel"
# Puerto local del nodo de control donde el puesto deja su sshd reenviado. Se
# DERIVA del vmid del puesto: no se guarda ni se declara. El rango (este valor +
# el vmid) deja sitio de sobra sin pisar el 22 ni puertos privilegiados.
engine_tunnel_puerto_base: 20000
# El puerto local del nodo de control por el que se alcanza el REST (el `www` de
# fábrica, puerto 80) de cada equipo con el que el motor habla por REST: el puesto de
# control reenvía también ese puerto por el MISMO túnel, y así el `uri` del motor se
# ejecuta en la máquina del motor en vez de delegado al puesto (medido: 4,4 s -> ~0,3 s
# por llamada). DERIVADO del vmid, como el del túnel; la banda no pisa la de arriba.
engine_tunnel_rest_puerto_base: 21000
# Ruta, dentro del nodo de control, del par de claves del túnel. Fuera del
# repositorio (nunca se versiona una clave privada) y fuera de `~/.ssh/config`.
# La clave del túnel es UNA POR LAB, y no por capricho: en el `authorized_keys` del nodo
# de control, OpenSSH usa la PRIMERA línea cuya clave case, así que con una sola clave y
# una línea por lab (cada lab tiene su puerto) sólo funcionaría el primer lab y los demás
# se quedarían mudos -- medido: `Remote: port forwarding refused`. Una clave por lab es
# una línea por clave, y no hay sombras posibles. El nombre del lab forma parte de la
# ruta, así que no hay nada que guardar: se vuelve a derivar.
engine_tunnel_clave_base: "~/.ssh/netlabs_tunnel"
# Cuántos segundos se espera a que el puerto reenviado conteste antes de decir
# que el túnel no está en pie.
engine_tunnel_espera: 45
# La consola de un invitado es la vía de acceso más frágil del motor: el invitado puede estar
# arrancado y su consola todavía no dar shell, así que la MISMA línea se reintenta.
# Medido: recién arrancado el contenedor, la primera línea se pierde (la consola devuelve
# el eco del terminal, no la salida de la shell) y unos segundos después entra. El guion
# es idempotente, así que repetirlo no hace daño: la unidad de systemd se reescribe igual.
engine_tunnel_intentos: 3
engine_tunnel_reintento: 12

# Cuánto se espera antes de empezar a sondear el puerto reenviado. El guion duerme 4
# segundos dentro del invitado antes de imprimir su marca, y el sshd tarda un poco
# más en aceptar: sondear sin este respiro sólo sirve para gastar el tiempo de espera.
engine_tunnel_retardo: 3

# Tamaño máximo, en caracteres, del cuerpo de la respuesta que se guarda en el
# diario. El diario es prueba de lo ocurrido, no una copia del cluster.
engine_diario_max_cuerpo: 2000

# --- La sonda de un etapa ---------------------------------------------------
# Cuánto se espera a que un etapa conteste antes de negarse a tocar el siguiente
# (regla 18). Son intentos cortos y seguidos: un CHR que acaba de arrancar tarda unos
# segundos en levantar su servidor web, y un Linux en abrir el sshd, pero un equipo roto
# no se arregla esperando media hora. Con estos números la ventana es de ~2 min y medio.
engine_sonda_intentos: 24     # número de intentos
engine_sonda_espera: 2        # segundos que se le dan a CADA intento de conexión
engine_sonda_pausa: 5         # segundos entre intento e intento
# --- Tareas asíncronas ----------------------------------------------------
# Proxmox crea, borra y recarga la red EN SEGUNDO PLANO: la llamada devuelve un
# UPID y el trabajo continúa después de responder. Para que un paso no corra
# contra algo que aún no existe (p. ej. arrancar un invitado que se está
# creando), el motor sondea `GET /nodes/<nodo>/tasks/<upid>/status` hasta que la
# tarea deja de estar "running".
#
# Cuántos sondeos como máximo, y cada cuánto. La espera CRECE: los primeros
# sondeos van seguidos (una tarea corta se detecta enseguida) y luego se espacian
# hasta `engine_tarea_intervalo_max`. Así el tope total es más ancho que antes
# (≈340s contra 300s) sin pagar 150 vueltas de bucle cuando la tarea acaba en la
# primera: cada vuelta DE MÁS cuesta ~63ms de intérprete aunque el cuerpo se salte
# (medido), y con 150 vueltas eran ~7s por espera, en balde.
engine_tarea_intentos: 40        # tope de sondeos por tarea
engine_tarea_intervalo: 2        # lo que se espera tras el PRIMER sondeo; de ahí crece
engine_tarea_intervalo_max: 15   # techo: nunca se espera más que esto entre sondeos

# --- Logs -----------------------------------------------------------------
# Cuántos informes `verify-*.json` se conservan por lab. Los más viejos se
# borran al escribir uno nuevo: el log rota, no crece sin fin.
#
# Uno. Lo que un humano LEE es `resumen.md` (y el veredicto suelto de
# `ultimo-verify.txt`); el informe es la evidencia congelada de la última
# comprobación, y nadie relee las de antes: la historia entera, paso a paso,
# está en el diario. Diez informes por lab eran diez ficheros que no se abren.
engine_retencion_informes: 1
