---
# PROPÓSITO:   declarar la topología del lab `04_lab-red-routeros`: el lab de ACEPTACIÓN
#              de la capa de configuración. Dos routers RouterOS (CHR) encadenados y
#              un bastión y un vigilante, con servidores y puestos como contenedores: es
#              lo que ejercita la cadena entera del arranque en frío -- el puesto de
#              control da la primera dirección, el primer CHR se configura por su
#              REST, el segundo etapa cuelga del primero, y los puestos obtienen su
#              dirección del CHR de su red (no de nadie de fuera).
# INVARIANTES: esta es la FUENTE DE VERDAD del lab. Aquí NO hay ningún vmid, ninguna
#              MAC y ninguna credencial: la identidad la deriva el motor (regla 11) y
#              la MAC de cada reserva DHCP se deriva del vmid del invitado que la
#              declara (regla 14). El nombre tiene que coincidir con el de la carpeta
#              (el pool de Proxmox se llama como la carpeta y es la frontera de
#              propiedad). Todo lo declarado cae dentro de `lab.espacio de direcciones`.
# LÍMITES:     el interior que este lab declara está en el vocabulario CERRADO del
#              motor: para RouterOS, identidad, servicios, cliente del DHCP de
#              fábrica, direcciones, rutas y servidor DHCP; para Linux, el túnel, la
#              dirección, el reenvío y el servidor DHCP. Las áreas que el encargo
#              nombra y el motor todavía no converge (puentes y cortafuegos de
#              RouterOS; pasarela, rutas, dns y claves de Linux) están DECLARADAS
#              como pendientes en `filter_plugins/interior.py` y la validación las
#              rechaza con su motivo: aquí no se declaran, para no fingir que se
#              configuran. Tampoco hay aplicaciones dentro de los invitados.
# VER:         labs/04_lab-red-routeros/04_lab-red-routeros.md;
#              docs/tunnel-del-bastion.md (el túnel, paso a paso);
#              docs/decisiones/0004 (el token y la consola), 0005 (las áreas)
#
# EL NOMBRE de cada invitado dice QUÉ ES, no de qué lab es (ADR 0015): aquí se leen
# `rt-borde`, `rt-nucleo`, `ctl-1`, `ctl-2`, `srv-1`, `ws-1` y `ws-2`.

lab:
  nombre: 04_lab-red-routeros

  # TRES etapas, y el orden es la mitad del diseño: primero el bastión
  # con el primer CHR (el que da y el que pide la primera dirección), después el
  # segundo etapa de la red --el segundo CHR y el servidor que cuelga del primero--
  # y sólo entonces los puestos dinámicos. Nunca se arranca un etapa antes de que
  # el anterior esté convergido y sirviendo (regla 18).
  stages: [1, 2, 3]

  # Todo lo del lab vive aquí. Lo vigila `./lab check address-space`: dentro, todo lo
  # declarado cae dentro; fuera, dos labs no pueden declarar el mismo espacio.
  address_space: 10.40.0.0/16

  # Los bridges son del NODO, no del lab (Proxmox no mete interfaces en pools): el
  # motor crea los que falten, los marca al crearlos y `destroy` sólo borra los que
  # llevan su marca. Tres: la de gestión (por donde entra el bastión y por
  # donde los CHR piden su primera dirección) y una por cada LAN que sirve un CHR.
  bridges:
    - nombre: vmb_gestion
      address: 10.40.0.1/24
    - nombre: vmb_lan1
      address: 10.40.1.1/24
    - nombre: vmb_lan2
      address: 10.40.2.1/24

  # El túnel lo construye el motor: un invitado con `config.linux.túnel` sale hacia
  # casa por su cuenta y hace de bastión del lab. Por dónde sale (host y puerto) es
  # ENTORNO -- la casa es una y los labs son muchos -- así que vive en secrets.yml y
  # no aquí.
  tunnel: {tipo: bastion}

vms:
  # El primer CHR: la vía de acceso de entrada del lab. Arranca SIN dirección y la pide por
  # DHCP; el bastión le tiene reservada (por su MAC derivada) exactamente
  # la dirección que aquí se declara, así que la petición y la declaración coinciden
  # sin que nadie escriba una MAC. Es tolerante: pide sin parar hasta que le
  # contestan, y por eso puede compartir etapa con el bastión.
  - rol: borde
    tipo: rt          # es un router CHR -> 'rt-borde' (el alias es su rol)
    stage: 1
    cores: 2
    memory: 512
    disk: 1
    # La imagen de fábrica del CHR. Se adjunta SÓLO al crear el invitado: una imagen
    # importada no se puede añadir después (habría que recrear la VM).
    image: chr-7.25.1.raw
    # DOS interfaces, en este orden: la de gestión (por donde pide su primera dirección y por
    # donde el motor entra a configurarlo) y la LAN que sirve. El orden ES la numeración
    # de las interfaces: `vmb_gestion` -> ether1, `vmb_lan1` -> ether2. Por eso el motor
    # comprueba en la declaración que no se configure una interfaz que no exista.
    bridges: [vmb_gestion, vmb_lan1]
    address: 10.40.0.11/24
    config:
      routeros:
        identity: rt-borde
        # `www` (que es donde vive REST) NO se toca: es el túnel de vuelta. Si se
        # deshabilita, el equipo deja de poder ser configurado para siempre.
        ip_services: {deshabilitar: [telnet, ftp, api, api-ssl]}
        # El cliente DHCP de fábrica, en ether1: se apaga DESPUÉS de tener la
        # dirección, porque mientras el motor no haya entrado es la única forma de
        # que el equipo sea alcanzable.
        dhcp_client: {deshabilitar: true}
        addresses:
          - {interface: ether2, address: 10.40.1.1/24}
        routes:
          - {dst_address: 0.0.0.0/0, gateway: 10.40.0.1}
        dhcp_server:
          - interface: ether2
            pool: {rango: 10.40.1.100-10.40.1.200}
            network: {address: 10.40.1.0/24, gateway: 10.40.1.1, dns: [10.40.1.1]}
            # Las reservas no se escriben: se DERIVAN de las direcciones estáticas
            # que los demás invitados de esa red declaran. Así ningún cliente
            # dinámico puede robarle la dirección a un router o a un servidor.
            static_leases: derived
  # El segundo CHR: cuelga de la LAN del primero. Su dirección es estática
  # declarada, y el primer CHR la tiene reservada por su MAC derivada -- por eso el
  # encadenamiento funciona: el que da la dirección está convergido antes de que
  # este arranque.
  - rol: nucleo
    tipo: rt          # el otro router del lab -> 'rt-nucleo'
    stage: 2
    cores: 1
    memory: 512
    disk: 1
    image: chr-7.25.1.raw
    # Otra vez dos interfaces, y en orden: la del etapa anterior (por donde pide su
    # dirección y su ruta por defecto al primer CHR) y la LAN que sirve este.
    bridges: [vmb_lan1, vmb_lan2]
    address: 10.40.1.11/24
    config:
      routeros:
        identity: rt-nucleo
        ip_services: {deshabilitar: [telnet, ftp, api, api-ssl]}
        dhcp_client: {deshabilitar: true}
        addresses:
          - {interface: ether2, address: 10.40.2.1/24}
        routes:
          - {dst_address: 0.0.0.0/0, gateway: 10.40.1.1}
        dhcp_server:
          - interface: ether2
            pool: {rango: 10.40.2.100-10.40.2.200}
            network: {address: 10.40.2.0/24, gateway: 10.40.2.1, dns: [10.40.2.1]}
            static_leases: derived
containers:
  # El bastión: la única interfaz que el motor necesita para ENTRAR en el lab.
  # Nace con una interfaz en el bridge de gestión del NODO (valor de entorno, no del lab)
  # y una por cada bridge del lab, todas al nacer (cambiarle las interfaces a un invitado
  # en marcha obliga a reiniciarlo, y aquí no se reinicia la máquina que trabaja).
  # Su dirección en el bridge del nodo la DERIVA el motor de entre las libres.
  - rol: control
    tipo: ctl         # un bastión (el bastión del lab) -> el nombre empieza por 'ctl-'
    nombre: 1         # -> 'ctl-1'
    stage: 1
    cores: 1
    # Sólo bastión: túnel, DHCP e `ip_forward`. 512 MB es lo que necesita para eso y
    # nada más -- el vigilante NO vive aquí (ADR 0029: el bastión es una pieza del
    # motor, y un JVM con PostgreSQL al lado lo tumba y se lleva la forma de entrar).
    memory: 512
    disk: 4
    bridge: vmb_gestion
    address: 10.40.0.10/24
    config:
      linux:
        # Vacío a propósito: que haya túnel lo dice la clave, no su contenido. Por
        # dónde sale es entorno (secrets.yml).
        tunnel: {}
        # Las interfaces EXTRA del bastión, una por bridge del lab: `eth0` es la de
        # gestión (el campo `address`, arriba) y ésta es la LAN. El motor no adivina
        # direcciones (regla 11), y sin una aquí no alcanza a lo que cuelga de ese bridge
        # (medido: el CHR del segundo etapa, 10.40.1.11, no contesta al REST y su
        # convergencia no se puede ni empezar).
        addresses:
          - interface: eth1
            address: 10.40.1.2/24
        # El que da la PRIMERA dirección: reserva, por la MAC derivada de cada CHR,
        # la dirección que ese CHR declara. Es lo que cierra el círculo del arranque
        # en frío.
        dhcp_server:
          interface: eth0
          rango: 10.40.0.50-10.40.0.99
          static_leases: derived
        ip_forward: true

  # EL VIGILANTE, en su propio invitado (ADR 0029 §B). No es el bastión: se cae él y
  # se cae su web, no el túnel. Vive en la red de gestión porque es la única que
  # comparten los dos routers (ahí nace `rt-borde`), y lleva UNA pata en la LAN del
  # primer CHR para alcanzar `rt-nucleo`, que no está en gestión.
  - rol: monitor
    tipo: ctl         # -> 'ctl-2'
    nombre: 2
    stage: 2          # después del primer CHR: cuando converge, ya hay algo que vigilar
    cores: 2
    # 2 GB: la JVM de Tomcat con la base al lado no cabe en menos (medido: el OOM killer
    # se lleva una de las dos).
    memory: 2048
    disk: 8
    bridge: vmb_gestion
    address: 10.40.0.20/24
    config:
      linux:
        # El vigilante y su terminal SSH (ADR 0035): una consola por router dentro de su
        # web. `terminal` no lleva valor, como `tunnel`: lo que hay lo dice la CLAVE.
        servicio: netxms
        terminal: {}
        # La LAN del primer CHR no está en su tarjeta: al que publica un servicio se le da
        # su red y la salida (ADR 0029 §3), no una pata por cada bridge del lab -- eso es del
        # bastión. Con una `addresses` aquí la dirección acababa puesta en `eth1`, que es la
        # salida (vmbr1), o sea en una red que no está: el terminal abría y no llegaba a
        # `rt-nucleo`. Se llega por donde se llega en cualquier red: una ruta por el router
        # que la sirve, que es quien tiene las dos patas.
        routes:
          - {dst_address: 10.40.1.0/24, gateway: 10.40.0.11}

  # Un servidor en la LAN del primer CHR: toma su dirección del DHCP del router, y
  # por eso se declara `dhcp` -- lo que se comprueba es que tiene dirección, que cae
  # dentro del rango declarado y que el router tiene una concesión para su MAC
  # derivada (las dos cosas, o no está verificado).
  - rol: servidor
    tipo: srv         # un servidor -> 'srv-'
    nombre: 1         # -> 'srv-1'
    stage: 2
    cores: 1
    memory: 512
    disk: 4
    bridge: vmb_lan1
    address: dhcp
    config:
      linux: {}

  # Dos puestos dinámicos, cada uno detrás de un CHR distinto. No arrancan hasta que
  # su CHR está convergido y sirviendo: por eso el arranque en frío no depende de que
  # alguien lance las cosas en el orden correcto.
  - rol: puesto-1
    tipo: ws          # un puesto de trabajo -> 'ws-1'
    nombre: 1
    stage: 3
    cores: 1
    memory: 512
    disk: 4
    bridge: vmb_lan1
    address: dhcp
    config:
      linux: {}

  - rol: puesto-2
    tipo: ws          # y el segundo -> 'ws-2'
    nombre: 2
    stage: 3
    cores: 1
    memory: 512
    disk: 4
    bridge: vmb_lan2
    address: dhcp
    config:
      linux: {}
#     ↑ sin `vmid` y sin `mac`: los deriva el motor leyendo el estado del clúster.
