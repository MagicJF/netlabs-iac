---
# PROPÓSITO:   la segunda declaración de juguete de los tests: es la prueba de que
#              dos labs distintos reciben vmids DISJUNTOS partiendo del mismo estado
#              del mundo.
# INVARIANTES: declara un rol con el MISMO nombre que el otro fixture A PROPÓSITO: el
#              vmid no se puede compartir. Y desde el ADR 0015 el NOMBRE tampoco los
#              desambigua -- el nombre dice qué EQUIPO es, no de qué lab es, así que
#              los dos `nucleo` se llaman `rt-nucleo` y quien dice de quién es cada
#              uno es el pool y la descripción (`lab=… rol=…`). Eso es exactamente lo
#              que hay que demostrar.
# LÍMITES:     direcciones de documentación (RFC 5737).
# VER:         test/test_identidad.py; docs/decisiones/0015-el-nombre-dice-que-es-el-equipo.md
lab:
  nombre: beta
  stages: [1]
  bridges:
    - nombre: vmb_beta
      address: 198.51.100.1/24
containers:
  - rol: nucleo
    tipo: rt          # el mismo tipo y el mismo rol que alfa -> el mismo nombre, 'rt-nucleo'
    stage: 1
    cores: 1
    memory: 256
    disk: 4
    bridge: vmb_beta
    address: 198.51.100.11/24
