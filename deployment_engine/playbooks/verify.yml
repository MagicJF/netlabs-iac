---
# PROPÓSITO:   el verbo `verify` y, a la vez, su TEST FINAL: comprueba en los DOS
#              sentidos que el mundo coincide con lo declarado. Falla con código de
#              salida != 0 si hay drift, y deja el informe en `logs/`.
# INVARIANTES: el conjunto ESPERADO se DERIVA de la declaración: el test nunca
#              recorre la lista que él mismo trae. Sobra algo = fallo; falta algo =
#              fallo; un invitado parado = fallo.
#              El informe se escribe ANTES de fallar, para que una verificación en
#              rojo deje la misma evidencia que una en verde.
# LÍMITES:     la dirección IP declarada no es verificable por API (vive dentro del
#              invitado). Lo dice el informe, en vez de dar por bueno lo que no ha
#              mirado. Y un invitado en el pool de otro lab se reporta como "de otro
#              lab", no como propio.
# VER:         README.md §Verificación; AGENTS.md §Qué correr y cuándo

- name: "VERIFY · ¿existe de verdad lo que se declaró?"
  hosts: proxmox_api
  gather_facts: false
  vars_files:
    - ../vars/engine.yml
  tasks:
    - name: "VERIFY · cargar la declaración del lab"
      ansible.builtin.include_vars:
        file: "{{ pve_archivo_lab }}"
        name: declaracion_cruda

    - name: "VERIFY · validar la coherencia de la declaración"
      ansible.builtin.include_tasks: ../tasks/validar.yml

    - name: "VERIFY · leer el mundo y re-derivar la identidad"
      ansible.builtin.include_tasks: ../tasks/identity.yml

    # La clave PÚBLICA del tunnel: el área `identity` de un RouterOS la declara, y sin
    # leerla aquí el interior parecería no tenerla -- un falso drift. `plan` y `preflight`
    # ya la leen así, y sólo leerla no escribe nada, ni en el invitado ni en casa.
    - name: "VERIFY · leer la clave pública del túnel (para poder compararla DENTRO)"
      ansible.builtin.include_tasks: ../tasks/tunnel.yml
      vars:
        tunnel_solo_clave: true
        tunnel_clave_generar: false
        tunnel_clave: "{{ engine_tunnel_clave_base }}_{{ pve_lab }}_ed25519"
      when: (declaracion.tunnel | default({}, true) | length) > 0

    # Los MISMOS parámetros que usa `apply` (mismos nombres, mismos valores): el driver
    # del interior los necesita para resolver direcciones, MAC y túnel. Si divergieran,
    # `verify` estaría midiendo otra cosa que la que `apply` construyó.
    - name: "VERIFY · parámetros del entorno (los mismos que usa `apply`)"
      ansible.builtin.set_fact:
        parametros_motor:
          # La credencial de los equipos, la MISMA con la que el motor los gobierna por su API
          # (secrets.yml). Va aquí porque el área `terminal` la necesita para darlos de alta en
          # el vigilante, y un filtro no lee secretos por su cuenta.
          routeros_usuario: "{{ engine_routeros_usuario | default('admin') }}"
          routeros_clave: "{{ routeros_clave | default('') }}"
          nodo: "{{ pve_nombre_nodo | default(pve_nodo) }}"
          ostemplate_lxc: "{{ engine_ostemplate_lxc }}"
          comentario_pool: "topología gestionada por netlabs_v4_b (motor por API)"
          comentario_bridge: "{{ engine_plantilla_comentario_bridge }}"
          bridge_gestion: "{{ pve_bridge_gestion | default('') }}"
          tunnel_host: "{{ pve_tunnel_salida_host | default('') }}"
          tunnel_puerto: "{{ pve_tunnel_salida_puerto | default(443) }}"
          tunnel_usuario: "{{ pve_tunnel_usuario | default('') }}"
          tunnel_puerto_base: "{{ engine_tunnel_puerto_base }}"
          tunnel_rest_puerto_base: "{{ engine_tunnel_rest_puerto_base }}"
          mac_prefijo: "{{ engine_prefijo_mac }}"
          tunnel_clave: "{{ engine_tunnel_clave_base }}_{{ pve_lab }}_ed25519"
          rol_control: "{{ engine_rol_control }}"
          almacenamiento_imagen: "{{ engine_almacenamiento_imagen }}"
          tunnel_clave_publica: "{{ tunnel_clave_publica | default('') }}"

    - name: "VERIFY · leer si el túnel del lab está en pie (para poder mirar dentro)"
      ansible.builtin.include_tasks: ../tasks/tunnel_probe.yml

    # Aquí sí hay que parar si no hay mundo: pero el informe se deja igual, porque
    # "no se pudo leer" es también un resultado y hay que poder demostrarlo.
    - name: "VERIFY · sello de tiempo del informe"
      ansible.builtin.set_fact:
        sello_tiempo: "{{ now().strftime('%Y%m%dT%H%M%SZ') }}"

    - name: "VERIFY · informe sin estado del mundo"
      ansible.builtin.copy:
        content: "{{ informe_sin_mundo | to_nice_json }}\n"
        dest: "{{ pve_carpeta_logs }}/verify-{{ sello_tiempo }}.json"
        mode: '0640'
      changed_when: false
      vars:
        informe_sin_mundo:
          lab: "{{ pve_lab }}"
          ok: false
          ts: "{{ sello_tiempo }}"
          estado_del_mundo: "{{ pve_mundo_origen | default('?') }}"
          motivo: "{{ pve_mundo_error | default('motivo desconocido') }}"
          nota: >-
            No se pudo leer Proxmox. La declaración es la fuente de verdad, pero sin
            leer la API no se puede comparar con nada: el resultado honesto es un
            fallo, no un aprobado.
          no_verificable:
            - "todo: sin estado del mundo no se ha comprobado ni un guest"
      when: (pve_mundo_error | default('') | length) > 0

    - name: "VERIFY · resumen humano sin estado del mundo"
      ansible.builtin.copy:
        content: |-
          ============================================================
          VERIFICACIÓN del lab '{{ pve_lab }}' — NO SE PUDO VERIFICAR
          ============================================================
          No hay estado del mundo: {{ pve_mundo_error | default('motivo desconocido') }}

          Se intentó leer la API en {{ pve_mundo_origen | default('?') }}.
          La declaración es la fuente de verdad, pero sin leer Proxmox no se puede
          comparar con nada: el resultado honesto es un fallo, no un aprobado.

          El diario de la ejecución (qué se pidió y qué respondió) está en:
            {{ pve_carpeta_logs }}/api.jsonl
        dest: "{{ pve_carpeta_logs }}/ultimo-verify.txt"
        mode: '0640'
      changed_when: false
      when: (pve_mundo_error | default('') | length) > 0

    - name: "VERIFY · parar si no hay estado del mundo"
      ansible.builtin.fail:
        msg: |-
          No se pudo verificar el lab '{{ pve_lab }}': no hay estado del mundo.
            {{ pve_mundo_error | default('motivo desconocido') }}
          El diario de la ejecución está en {{ pve_carpeta_logs }}/api.jsonl
      when: (pve_mundo_error | default('') | length) > 0

    # --- EL INTERIOR, comprobado DENTRO (y sin tocar nada) --------------------------
    # `verify` mira en los DOS mundos: el de la API (abajo) y el de dentro de cada
    # invitado. Se relee cada invitado por su pasarela con el MISMO driver que usa
    # `apply`, en modo `solo_leer` --no escribe nada: comprobar no cambia el mundo
    # (regla 6)--, y se compara la lectura con lo declarado en los DOS sentidos. Si el
    # túnel no responde, no se entra: se anota «no comprobable» en vez de aprobar a
    # ciegas. `verify` NO construye el túnel (eso es de `apply`).
    # Si el túnel no responde, los invitados no se pueden leer por dentro. NO se pasa
    # por alto: se anota cada uno como «no comprobable» y el veredicto cae -- verificar
    # no es aprobar lo que no se ha mirado. Quien reconstruye el túnel es `apply`.
    - name: "VERIFY · si el túnel no responde, anotar lo que NO se ha podido mirar"
      ansible.builtin.set_fact:
        interior_informe: >-
          {{ declaracion | interior_a_verificar
             | interior_sin_comprobar('el tunnel del lab no responde: `./lab --lab '
               ~ pve_lab ~ ' apply` lo reconstruye') }}
      when: >-
        not (estado.tunnel.responde | default(false))
        and (declaracion | interior_a_verificar | length) > 0

    - name: "VERIFY · mirar dentro de cada invitado que declara config (sin escribir)"
      ansible.builtin.include_tasks: ../tasks/interior_verificar.yml
      loop: "{{ declaracion | interior_a_verificar }}"
      loop_control:
        loop_var: interior_entrada
      vars:
        interior_rol: "{{ interior_entrada.rol }}"
        interior_tipo_verificar: "{{ interior_entrada.tipo }}"
      when: estado.tunnel.responde | default(false)

    - name: "VERIFY · comparar la declaración con la API (en los dos sentidos)"
      ansible.builtin.set_fact:
        informe: "{{ declaracion | estado_verificar(estado, identidad) }}"

    # El interior entra en el MISMO informe y en el MISMO veredicto: un solo `ok`.
    - name: "VERIFY · fundir el interior en el informe (un solo veredicto)"
      ansible.builtin.set_fact:
        informe: >-
          {{ informe
             | combine({'interior': (interior_informe | default({}))})
             | combine({'ok': (informe.ok | bool)
                              and ((interior_informe | default({})) | interior_informe_ok)}) }}

    # Evidencia versionable: el JSON tiene todo lo comprobado, para poder citarlo.
    - name: "VERIFY · escribir la evidencia (logs/verify-<sello>.json)"
      ansible.builtin.copy:
        content: "{{ informe | combine({'ts': sello_tiempo, 'estado_del_mundo': pve_mundo_origen}) | to_nice_json }}\n"
        dest: "{{ pve_carpeta_logs }}/verify-{{ sello_tiempo }}.json"
        mode: '0640'
      # La evidencia es un log: escribirla no cambia el mundo (regla 6).
      changed_when: false

    - name: "VERIFY · escribir el resumen humano (para la consola)"
      ansible.builtin.copy:
        content: "{{ informe | estado_informe_texto }}\n"
        dest: "{{ pve_carpeta_logs }}/ultimo-verify.txt"
        mode: '0640'
      changed_when: false

    # Retención: los logs rotan. Sin esto, cada ejecución dejaría un fichero más y el
    # directorio crecería sin fin.
    - name: "VERIFY · listar los informes que ya hay"
      ansible.builtin.find:
        paths: "{{ pve_carpeta_logs }}"
        patterns: "verify-*.json"
      register: informes_previos

    - name: "VERIFY · borrar los informes más viejos (retención)"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (informes_previos.files | sort(attribute='path'))[: -engine_retencion_informes | int] }}"
      when: (informes_previos.files | length) > (engine_retencion_informes | int)
      # Borrar un informe VIEJO de `logs/` no es cambiar el mundo (ver plan.yml): sin
      # esto, una segunda pasada saldría con un `changed` que no lo es (regla 6).
      changed_when: false

    - name: "VERIFY · resultado"
      ansible.builtin.fail:
        msg: |-
          Verificación FALLIDA para el lab '{{ pve_lab }}':
            faltan={{ informe.faltan | length }}  sobran={{ informe.sobran | length }}
            drift={{ informe.drift | length }}  parados={{ informe.parados | length }}
            de otro lab={{ informe.otros_lab | length }}
          Resumen:   {{ pve_carpeta_logs }}/ultimo-verify.txt
          Evidencia: {{ pve_carpeta_logs }}/verify-{{ sello_tiempo }}.json
      when: not informe.ok

    - name: "VERIFY · resultado"
      ansible.builtin.debug:
        msg: >-
          verificación CORRECTA del lab '{{ pve_lab }}': {{ informe.conformes | length }}
          invitado(s) existen, coinciden y están arrancados.
          Evidencia: {{ pve_carpeta_logs }}/verify-{{ sello_tiempo }}.json
      when: informe.ok
