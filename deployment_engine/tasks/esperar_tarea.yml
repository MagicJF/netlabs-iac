---
# PROPÓSITO:   esperar a que una tarea asíncrona de Proxmox (un UPID) termine. Es
#              lo que convierte "lancé la creación" en "la creación terminó".
# INVARIANTES: se sondea LLAMANDO A LA API por la puerta, no con un `until` que
#              llamaría a espaldas del diario: cada sondeo deja su línea (regla
#              4.6). El bucle es finito: si la tarea no termina a tiempo, el verbo
#              FALLA con mensaje claro; si termina con un `exitstatus` que NO sea
#              éxito ("OK" o "WARNINGS: N"), también falla (y lo dice).
# LÍMITES:     sólo sondea tareas de Proxmox. No cancela la tarea, no reintenta la
#              operación original y no adivina la causa de un fallo.
# VER:         README.md §Una sola puerta hacia la API; AGENTS.md §Reglas duras (4.6)
#
# Espera: pve_tarea_upid, pve_tarea_nodo (hechos, ya anotados por
#         `pve_api_y_esperar.yml`).
# Deja:   pve_tarea_terminada, pve_tarea_estado, pve_tarea_exitstatus.

# El corte del bucle vive DENTRO de `esperar_paso.yml`, no aquí: un `when` sobre un
# `include_tasks` con `loop` NO se re-evalúa por vuelta (se comprobó con una prueba
# mínima), así que no sirve para cortar. La condición va en el cuerpo, que sí se
# re-evalúa cada vuelta; las vueltas de más quedan en no-op.
- name: "ESPERA · sondear la tarea hasta que termine (máx. {{ engine_tarea_intentos }} intentos)"
  ansible.builtin.include_tasks: esperar_paso.yml
  loop: "{{ range(1, (engine_tarea_intentos | int) + 1) | list }}"
  loop_control:
    loop_var: pve_tarea_intento

- name: "ESPERA · fallar si la tarea no terminó a tiempo"
  ansible.builtin.fail:
    msg: |-
      La tarea de Proxmox no terminó a tiempo.
        upid:          {{ pve_tarea_upid }}
        sondeos:       {{ engine_tarea_intentos }} (uno cada {{ engine_tarea_intervalo }}s)
        último estado: {{ pve_tarea_estado }}
      El diario de esta ejecución está en {{ pve_carpeta_logs }}/api.jsonl
  when: not (pve_tarea_terminada | default(false) | bool)

# `exitstatus` de una tarea terminada es "OK" si fue limpia, "WARNINGS: N" si acabó
# BIEN pero con avisos (Proxmox los usa para cosas no fatales), o un mensaje de error.
# Cuentan como éxito "OK" y "WARNINGS: N"; lo demás es un fallo.
- name: "ESPERA · fallar si la tarea terminó con error"
  ansible.builtin.fail:
    msg: |-
      La tarea de Proxmox terminó con error.
        upid:       {{ pve_tarea_upid }}
        exitstatus: {{ pve_tarea_exitstatus }}
      El diario de esta ejecución está en {{ pve_carpeta_logs }}/api.jsonl
  when:
    - pve_tarea_terminada | default(false) | bool
    - not ((pve_tarea_exitstatus | default('OK')) is match('^(OK|WARNINGS)'))
