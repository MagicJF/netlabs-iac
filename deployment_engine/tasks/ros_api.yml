---
# PROPÓSITO:   LA VÍA DE ACCESO A ROUTEROS. Es el único sitio del repositorio que habla con el
#              REST de un invitado, y es a la vez el que escribe la línea del diario:
#              hacer la petición y diarizarla son UNA sola cosa, igual que en la vía de acceso
#              de Proxmox (regla 12: cuatro vías de acceso, tres diarios).
#
#              La llamada SE HACE AQUÍ, en la máquina donde corre Ansible: NO se delega
#              en el bastión (era el único `delegate_to` del motor). Al REST
#              de un invitado no se llega desde casa, así que el BASTIÓN le
#              deja abierto un túnel --reenvía el puerto 80 del invitado por el MISMO
#              túnel del túnel (tasks/tunnel.yml)-- y esta vía de acceso llama a
#              `127.0.0.1:<puerto derivado del vmid>`. Así las llamadas se ejecutan en
#              UN solo sitio (el motor), el puesto sólo hace de túnel, y se mide: la
#              misma llamada delegada costaba 4,4 s y así cuesta ~0,3 s
#              (informe-rendimiento-despliegue.md).
#
# INVARIANTES: una línea JSON por petición en `logs/api.jsonl`, SIEMPRE, salga bien o
#              mal, con `api: routeros` y el rol del invitado. La contraseña NO se
#              escribe nunca en el diario: los campos que son credenciales se tapan por
#              su nombre (`sin_secretos`), sin depender de que el llamante se acuerde.
#              El diario es un log: `changed_when: false` al escribirlo.
#              `ros_direccion` sigue siendo la del INVITADO --lo que se diariza y lo que
#              se lee en los errores--; por donde se viaja es por `ros_puerto`.
# LÍMITES:     esta tarea sólo sabe hacer UNA llamada: no decide qué llamar ni en qué
#              orden (eso es el driver) ni interpreta la respuesta (eso son los filtros
#              puros de `interior.py`). El HTTP en claro es deliberado y temporal: el CHR
#              de fábrica no trae certificado (ver docs/decisiones/0006-*.md).
#              El túnel sólo reenvía el REST de los equipos que la DECLARACIÓN declara
#              con `config.routeros`: a un invitado sin interior de RouterOS no se le
#              llama, y sin túnel no hay puerto.
# VER:         docs/decisiones/0006-*.md; docs/decisiones/0010-*.md;
#              tasks/configurar_routeros.yml; ./lab check access
#
# Variables que espera:
#   ros_metodo       GET | POST | PUT | DELETE
#   ros_ruta         ruta relativa a /rest (p. ej. /system/identity)
#   ros_cuerpo       (opcional) los parámetros de la llamada, en JSON
#   ros_cuerpo_diario  (opcional) lo que se ESCRIBE en el diario en lugar de `ros_cuerpo`:
#                    lo usa el guion, que lleva la contraseña DENTRO del texto del script
#   ros_area         (opcional) el área del interior a la que pertenece la llamada
#   ros_acumular     (opcional) guardar el resultado en `ros_leidos`, por ruta: es lo
#                    que permite leer VARIAS rutas en un bucle sin quedarse sólo con
#                    la última (el driver lee un área por llamada)
#   ros_direccion    la dirección del invitado en el bridge del lab (para el diario y
#                    para los mensajes: es lo que el lector reconoce)
#   ros_puerto       el puerto local del nodo de control por el que el túnel reenvía el
#                    REST de ESE invitado (derivado de su vmid: `interior_puerto_rest`)
#   ros_usuario ros_clave   la credencial con la que se llama
#   ros_invitado     el rol del invitado (para el diario)
#   ros_etiqueta     (opcional) para qué era esta llamada
#   ros_tolerar_error  (opcional) no fallar en error: el llamante decide
# Y deja en `ros_ultimo_*` el status, el cuerpo, los datos y el error legible.

# Sin túnel abierto no hay gateway: se dice ANTES de intentar nada y con el remedio, en
# vez de fallar con un error de conexión que no explica nada (regla 16).
- name: "ACCESO ROUTEROS · ¿hay túnel abierto hacia el REST de este invitado?"
  ansible.builtin.fail:
    msg: |-
      No se puede hablar con el REST de '{{ ros_guest | default('?') }}': no hay
      túnel abierto hacia su REST.

      El motor no llega solo a la red del lab: el BASTIÓN reenvía el puerto 80
      del invitado por el mismo túnel del túnel, y este paso no trae el puerto por el
      que hacerlo. Eso significa que el túnel de este lab no se ha construido en este
      verbo --o que se construyó antes de que este invitado entrara en el túnel--:
      lanza `./lab --lab {{ pve_lab }} apply`, que construye el túnel primero (y ningún
      etapa empieza antes de que el túnel responda).

      Si el lab venía de una versión anterior del motor, el túnel está en pie pero NO
      reenvía los REST: hay que REHACERLO. `apply` lo rehace solo: su comprobación del
      túnel ya mira también los puertos de REST de los invitados que existen.
  when: (ros_puerto | default('') | string | length) == 0

# La RED DE SEGURIDAD del modo «sólo leer» (lo usa `verify`): en sólo-lectura esta vía de acceso
# SÓLO atiende GET, y escribir por ella PARA. Es lo que hace IMPOSIBLE que una comprobación
# cambie el mundo, aunque un driver olvidara su guarda: la frontera está en la vía de acceso, no
# en la memoria de quien llama. Se MIDIÓ al implementar `verify` mirando dentro: una guarda
# en el driver no basta, porque el driver sigue teniendo la sección de escribir.
- name: "ACCESO ROUTEROS · en sólo lectura, esta vía de acceso NO escribe"
  ansible.builtin.fail:
    msg: |-
      Se ha pedido ESCRIBIR en un invitado en modo «sólo lectura»:
      {{ ros_metodo }} {{ ros_ruta }} sobre '{{ ros_guest | default('?') }}'.

      En «sólo leer» (lo usa `verify`) la vía de acceso sólo atiende GET: comprobar no cambia el
      mundo. Si esto salta, es un bug del driver, no de la declaración.
  when: >-
    (interior_solo_leer | default(false))
    and (ros_metodo | default('GET') | upper) != 'GET'

- name: "ACCESO ROUTEROS · cronometrar {{ ros_metodo }} {{ ros_ruta }}"
  ansible.builtin.set_fact:
    ros_t0: "{{ now() }}"

# `no_log`: el resultado contiene la cabecera Authorization con la credencial.
# `failed_when: false`: primero se DIARIZA, después se decide.
- name: "REST {{ ros_metodo }} {{ ros_ruta }} de '{{ ros_guest | default('?') }}'"
  ansible.builtin.uri:
    # Por `127.0.0.1` y por el puerto que el túnel deja abierto hacia ESE invitado: la
    # llamada sale de esta máquina, y el bastión sólo hace de túnel. La dirección
    # del invitado sigue siendo `ros_direccion` --es la que se diariza y la que se lee en
    # los errores--, pero por ahí NO se viaja.
    url: "http://127.0.0.1:{{ ros_puerto }}/rest{{ ros_ruta }}"
    method: "{{ ros_metodo }}"
    url_username: "{{ ros_usuario }}"
    url_password: "{{ ros_clave }}"
    force_basic_auth: true
    # TRAMPA MEDIDA (CHR 7.25.1): si se manda `body_format: json` con el cuerpo OMITIDO
    # --que es lo que hace un GET--, el servidor web del CHR no contesta y la llamada
    # muere por timeout a los 30 segundos, como si el equipo no estuviera. Sin
    # `body_format` no pasa. Así que el formato del cuerpo sólo se declara al ESCRIBIR, y
    # en una lectura ni se menciona. (Comprobado bisecando: la misma llamada con
    # `status_code` va bien; lo que la rompe es el formato del cuerpo en un GET.)
    body: "{{ ros_cuerpo | default(omit) }}"
    body_format: "{{ 'json' if (ros_metodo | upper in ['POST', 'PUT']) else omit }}"
    timeout: "{{ engine_timeout_api }}"
    return_content: true
    # Los 4xx NO hacen fallar la tarea: un 401 (credencial de fábrica) o un 400 (un
    # objeto que no existe) son respuestas que el motor necesita LEER y diarizar.
    status_code: [200, 201, 400, 401, 403, 404, 405, 500]
  register: ros_respuesta
  no_log: true
  failed_when: false
  # Una lectura no cambia nada; una escritura sí. Es lo que hace verdadera la promesa de
  # idempotencia (regla 6): la segunda ejecución de un verbo convergido sólo lleva GET.
  changed_when: ros_metodo | upper not in ['GET', 'HEAD']

- name: "ACCESO ROUTEROS · clasificar la respuesta de {{ ros_ruta }}"
  ansible.builtin.set_fact:
    # Sin conexión no hay `status`: -1 lo representa y es legible en el diario.
    ros_ultimo_status: "{{ ros_respuesta.status | default(-1) | int }}"
    ros_ultimo_cuerpo: "{{ ros_respuesta.content | default('') }}"
    ros_ultimo_json: "{{ ros_respuesta.json | default({}, true) }}"
    ros_ultimo_crudo: "{{ ros_respuesta.msg | default('') }}"
    ros_duracion_ms: "{{ ((now() - ros_t0).total_seconds() * 1000) | round(0) | int }}"

- name: "ACCESO ROUTEROS · extraer los datos de {{ ros_ruta }}"
  ansible.builtin.set_fact:
    # RouterOS devuelve LISTA al preguntar por una tabla y OBJETO al preguntar por un
    # dato suelto (`/system/identity` -> `{"name": "CHR"}`). Se deja tal cual llegó y
    # el analizador decide: normalizar aquí escondería cuál de las dos cosas contestó.
    ros_ultimo_datos: "{{ ros_ultimo_json if ros_ultimo_status < 400 else {} }}"
    # El error legible sale de una TABLA, no de una cadena de if/elif.
    ros_ultimo_error: "{{ errores_conocidos.get(ros_ultimo_status, error_generico) }}"
  vars:
    errores_conocidos:
      -1: >-
        no se pudo conectar con el túnel hacia {{ ros_direccion }} (127.0.0.1:{{
        ros_puerto }}) -- puede que el túnel no esté en pie, que el guest no esté
        arrancado, que su dirección no sea la declarada, o que el túnel no reenvíe ESE
        puerto (un túnel construido antes de este cambio: se rehace con
        `./lab --lab {{ pve_lab }} apply`). Lo que dijo el transporte: {{ ros_ultimo_crudo }}
      400: >-
        RouterOS no aceptó la llamada (400): {{ ros_ultimo_json.message | default('') }}
        {{ ros_ultimo_json.detail | default('') }}
      401: >-
        RouterOS no acepta la credencial del motor (401): puede ser la primera
        convergencia (el equipo aún tiene la de fábrica) o que la de secrets.yml ya no
        valga
      403: >-
        RouterOS rechazó la credencial por permisos (403)
      404: >-
        esa ruta no existe en este RouterOS (404): {{ ros_ruta }}
    error_generico: >-
      {{ 'RouterOS respondió ' ~ ros_ultimo_status ~ ' a ' ~ ros_metodo ~ ' ' ~ ros_ruta
         if ros_ultimo_status >= 400 else '' }}

# El diario va SIEMPRE, antes de decidir nada: un 401 queda registrado igual de bien
# que un 200. Y los parámetros se tapan: la contraseña del motor viaja en el cuerpo de
# alguna llamada (poner la credencial) y NUNCA puede acabar escrita aquí.
- name: "DIARIO · {{ ros_metodo }} {{ ros_ruta }} en '{{ ros_guest | default('?') }}'"
  ansible.builtin.lineinfile:
    path: "{{ pve_carpeta_logs }}/api.jsonl"
    line: "{{ diario | to_json }}"
    create: true
    mode: '0640'
    insertafter: EOF
  vars:
    diario:
      ts: "{{ ros_t0.isoformat() }}"
      verb: "{{ pve_verb }}"
      lab: "{{ pve_lab }}"
      api: routeros
      access: rest
      guest: "{{ ros_guest | default('') }}"
      method: "{{ ros_metodo }}"
      path: "{{ ros_ruta }}"
      params: "{{ (ros_cuerpo_diario | default(ros_cuerpo)) | default({}) | interior_sin_secretos }}"
      status: "{{ ros_ultimo_status }}"
      duration_ms: "{{ ros_duracion_ms }}"
      etiqueta: "{{ ros_etiqueta | default('') }}"
      response: "{{ (ros_ultimo_json | to_json)[: (engine_diario_max_cuerpo | default(0) | int)] }}"
  changed_when: false

# Acumulación: una lectura es una RUTA, así que la ruta es la clave natural. Sin esto,
# leer cuatro tablas en un bucle dejaría sólo la última y el analizador vería un equipo
# a medias. Es estado de ESTA ejecución: no se guarda nada (regla 11).
- name: "ACCESO ROUTEROS · acumular lo leído en {{ ros_ruta }}"
  ansible.builtin.set_fact:
    ros_leidos: >-
      {{ (ros_leidos | default({})) | combine({ ros_ruta: {
           'area': ros_area | default(''),
           'ruta': ros_ruta,
           'status': ros_ultimo_status,
           'json': ros_ultimo_datos,
           'error': ros_ultimo_error } }) }}
  when: ros_acumular | default(false) | bool
  changed_when: false

# Salvo que el llamante pida tolerar errores (el driver sabe qué esperaba de un 401 en la
# primera convergencia), una respuesta de error PARA el verbo, con el túnel de vuelta.
- name: "ACCESO ROUTEROS · parar si el router respondió con error"
  ansible.builtin.fail:
    msg: |-
      La llamada al REST de '{{ ros_guest | default('?') }}' ({{ ros_direccion }}, por
      el puerto {{ ros_puerto }} del túnel) ha fallado: {{ ros_metodo }} {{ ros_ruta }}
          {{ ros_ultimo_error | default('error desconocido') }}
      El diario de esta ejecución está en {{ pve_carpeta_logs }}/api.jsonl
  when:
    - not (ros_tolerar_error | default(false) | bool)
    - (ros_ultimo_error | default('') | length) > 0
