---
# PROPÓSITO:   LA GUARDA DE MÍNIMOS PRIVILEGIOS. Comprueba que el token del motor
#              tiene EXACTAMENTE lo que necesita, repartido por ruta, y NO tiene lo
#              que podría usar para darse más. Un mínimo privilegio que no se
#              prueba es una intención: por eso esto no es prosa, es una llamada.
#
#              Son dos comprobaciones, y las dos son necesarias:
#                1. LÓGICA: lo que el nodo tiene concedido en cada rol del motor
#                   (`GET /access/roles`, una sola lectura) contra el mapa del
#                   motor (vars/engine.yml: un rol por RUTA). Se compara rol a rol
#                   -- y no contra la unión -- porque un solo rol concedido en
#                   cinco rutas da la UNIÓN de todo en todas partes: lo medimos
#                   así en el nodo, con `Sys.Modify` y `Datastore.AllocateSpace`
#                   metidos en la ruta de `/vms`, donde no pintan nada.
#                2. NEGATIVA (la que de verdad prueba): la OPERACIÓN NULA sobre
#                   CADA rol -- `PUT /access/roles/<el suyo>` con la MISMA lista
#                   de privilegios que ya tiene -- DEBE responder 403. Es nula
#                   porque no cambia nada si se permite; y es la prueba porque,
#                   si el token pudiera hacerla, podría hacer la siguiente con
#                   otra lista y concederse `VM.Console`, `Sys.Console` o
#                   `Permissions.Modify` en una sola llamada.
#
# INVARIANTES: este fichero es el ÚNICO del motor autorizado a hablar con
#              `/access/...` (regla 12), y lo incluye SÓLO `preflight`. No
#              concede NADA: lee y hace una operación que no cambia nada. El motor
#              no se auto-concede privilegios jamás (regla 16).
# LÍMITES:     prueba que el token no puede reescribir NINGUNO de sus roles, y que
#              lo concedido coincide con lo exigido. No prueba nada sobre lo que
#              otro administrador pueda hacer en el nodo, ni sobre las ACLs de
#              rutas que el motor no declara.
# VER:         docs/decisiones/0004-*.md; ./lab check privilegios; ./lab preflight

- name: "PRIVILEGIOS · leer los roles del nodo (una sola lectura: GET /access/roles)"
  ansible.builtin.include_tasks: pve_api.yml
  vars:
    pve_api_metodo: "GET"
    pve_api_ruta: "/access/roles"
    pve_api_etiqueta: "guarda de mínimos privilegios: leer los roles del nodo"

- name: "PRIVILEGIOS · comparar rol a rol con lo exigido y lo vedado"
  ansible.builtin.set_fact:
    pve_privilegios: >-
      {{ pve_api_ultimo_datos
         | estado_privilegios_roles(engine_privilegios_por_rol, engine_privilegios_vedados) }}

- name: "PRIVILEGIOS · cada rol del motor tiene lo suyo, y nada vedado ni de otra ruta"
  ansible.builtin.assert:
    that: pve_privilegios.ok
    quiet: true
    fail_msg: |
      Los privilegios de los roles del motor ({{ pve_token_id }}) NO son los
      mínimos que el motor necesita:

      {{ pve_privilegios.texto }}

      Es un cambio de UNA vez, en el hipervisor, y va por RUTA (nunca en `/`, que
      propaga y da a todas partes lo de una). Lo que el motor exige, con su porqué,
      está en vars/engine.yml y en docs/decisiones/0004-*.md. No se afloja la lista
      para que pase: se corrige el rol.
    success_msg: "  {{ pve_privilegios.texto | replace('\n', '\n  ') }}"

# La operación nula, sobre CADA rol del motor. En un fichero aparte porque un `loop`
# necesita un cuerpo: el bucle no puede llevar el `assert` dentro si no es así.
- name: "PRIVILEGIOS · operación nula sobre cada rol del motor (todas deben ser 403)"
  ansible.builtin.include_tasks: guardia_privilegios_rol.yml
  loop: "{{ engine_privilegios_por_rol.keys() | list }}"
  loop_control:
    loop_var: pve_rol_vigilado
    label: "{{ pve_rol_vigilado }}"
