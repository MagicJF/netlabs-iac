---
# PROPÓSITO:   el verbo `apply`. Converge lo declarado ejecutando EL MISMO plan que
#              imprime `plan`, y al terminar verifica: el verbo no se cree a sí mismo.
# INVARIANTES: no hay una segunda lógica de decisión. Si `plan` y `apply` pudieran
#              hacer cosas distintas, revisar el plan no serviría de nada.
#              Es idempotente: lo que ya coincide NO genera llamada, así que una
#              segunda ejecución seguida no cambia nada (regla 4.9).
#              Nunca borra un invitado que no esté en la declaración.
# LÍMITES:     la API de Proxmox crea, borra y recarga la red de forma asíncrona;
#              el motor ESPERA cada tarea sondeando la API (tasks/esperar_tarea.yml)
#              antes de dar el paso por hecho. Lo que NO hace es reintentar una
#              operación que haya fallado: la deja fallar y lo dice.
# VER:         README.md §Cómo se usa; AGENTS.md §Qué correr y cuándo

- name: "APPLY · converger lo declarado"
  hosts: proxmox_api
  gather_facts: false
  vars_files:
    - ../vars/engine.yml
  tasks:
    - name: "APPLY · cargar la declaración del lab"
      ansible.builtin.include_vars:
        file: "{{ pve_archivo_lab }}"
        name: declaracion_cruda

    - name: "APPLY · validar la coherencia de la declaración"
      ansible.builtin.include_tasks: ../tasks/validar.yml

    - name: "APPLY · leer el mundo y asignar identidad"
      ansible.builtin.include_tasks: ../tasks/identidad.yml

    - name: "APPLY · parar si no hay estado del mundo"
      ansible.builtin.fail:
        msg: |-
          No se pudo leer el estado del mundo para el lab '{{ pve_lab }}':
            {{ pve_mundo_error | default('motivo desconocido') }}
          Aplicar sin saber qué hay es exactamente lo que este motor no hace: podría
          crear un invitado encima de otro. No se aplica nada.
      when: (pve_mundo_error | default('') | length) > 0

    # La clave PÚBLICA del camino se necesita ANTES de calcular el plan: el plan la
    # inyecta al CREAR el puesto de control (`ssh-public-keys`) y después ya no se
    # puede. `apply` puede generarla (es un verbo de escritura); `plan` y `preflight`
    # sólo la leen: mirar qué haría el motor no escribe nada, ni en su propia máquina.
    - name: "APPLY · preparar la clave del camino (antes de planificar)"
      ansible.builtin.include_tasks: ../tasks/camino.yml
      vars:
        camino_solo_clave: true
        camino_clave_generar: true
        camino_clave: "{{ engine_camino_clave_base }}_{{ pve_lab }}_ed25519"
      when: (declaracion.camino | default({}, true) | length) > 0

    - name: "APPLY · parámetros del entorno"
      ansible.builtin.set_fact:
        parametros_motor:
          nodo: "{{ pve_nombre_nodo | default(pve_nodo) }}"
          ostemplate_lxc: "{{ engine_ostemplate_lxc }}"
          comentario_pool: "topología gestionada por netlabs_v4_b (motor por API)"
          # La marca que el motor escribe en el `comments` de cada bridge que CREA:
          # es la prueba de propiedad que `destroy` busca antes de borrar un bridge
          # (Proxmox no mete interfaces de red en pools, así que no hay pool que valga).
          comentario_bridge: "{{ engine_plantilla_comentario_bridge }}"
          # El CAMINO (§5): por dónde sale el puesto de control hacia casa. Es ENTORNO
          # --la casa es una y los labs son muchos--, así que vive en secrets.yml y no
          # en la declaración de ningún lab. Vacío = este lab no tiene camino.
          bridge_gestion: "{{ pve_bridge_gestion | default('') }}"
          camino_host: "{{ pve_camino_salida_host | default('') }}"
          camino_puerto: "{{ pve_camino_salida_puerto | default(443) }}"
          camino_usuario: "{{ pve_camino_usuario | default('') }}"
          camino_puerto_base: "{{ engine_camino_puerto_base }}"
          # El prefijo de las MAC: la identidad de un invitado con varias patas
          # sale de aquí (una MAC por pata, derivada del vmid; ver
          # `identidad_mac_de_pata`).
          mac_prefijo: "{{ engine_prefijo_mac }}"
          camino_clave: "{{ engine_camino_clave_base }}_{{ pve_lab }}_ed25519"
          rol_control: "{{ engine_rol_control }}"
          # Dónde vive la imagen de fábrica que importa una VM al nacer (el
          # contenido `import` del almacenamiento). Es del ENTORNO, no de ningún lab.
          almacenamiento_imagen: "{{ engine_almacenamiento_imagen }}"
          # La clave pública del camino, que lee `tasks/camino.yml` antes de planificar
          # y que el plan mete en la creación del puesto de control.
          camino_clave_publica: "{{ camino_clave_publica | default('') }}"

    # Si el camino YA responde, el plan no emite `construir_camino`: no se reescribe el
    # `authorized_keys` de casa ni se reenvía la orden por la consola (regla 6). Es una
    # LECTURA local, y se hace antes de calcular el plan.
    - name: "APPLY · leer si el camino del lab ya está en pie"
      ansible.builtin.include_tasks: ../tasks/camino_mundo.yml

    # El plan se recalcula aquí con la misma función que usa `plan`: mismo código,
    # mismos datos, misma decisión.
    - name: "APPLY · calcular el plan"
      ansible.builtin.set_fact:
        plan_pasos: "{{ declaracion | estado_plan(estado, identidad, parametros_motor) }}"

    - name: "APPLY · escribir el plan que se va a ejecutar (evidencia)"
      ansible.builtin.copy:
        content: "{{ plan_pasos | estado_plan_texto(declaracion, estado, identidad) }}\n"
        dest: "{{ pve_carpeta_logs }}/apply-ultimo-plan.txt"
        mode: '0640'
      # Escribir en logs/ no es cambiar el mundo (ver plan.yml).
      changed_when: false

    - name: "APPLY · resumen de lo que se va a hacer"
      ansible.builtin.debug:
        msg: >-
          '{{ pve_lab }}': {{ plan_pasos | length }} paso(s) por ejecutar
          (estado del mundo de {{ pve_mundo_origen }})

    # Los pasos que este motor TODAVÍA no sabe ejecutar se dicen ANTES de empezar: se
    # ejecutará lo que va antes y se parará en el primero de ellos, nombrando cuál.
    - name: "APPLY · avisar de los pasos que el motor todavía no sabe ejecutar"
      ansible.builtin.debug:
        msg: |-
          AVISO: de este plan hay pasos que el motor todavía no sabe ejecutar (la capa
          de configuración está en construcción). Se ejecutará todo lo anterior y se
          parará en el primero de estos, diciendo cuál falta:
          {% for paso in pasos_sin_ejecutor %}
            - paso {{ paso.orden }} ({{ paso.accion }}, vía '{{ paso.via }}'): {{ paso.porque }}
          {% endfor %}
      vars:
        # «No tiene ejecutor» no lo decide esta plantilla: lo dice el motor
        # (`interior_sin_driver`, con su lista de drivers). Así el aviso no puede
        # quedarse viejo mientras los drivers llegan.
        pasos_sin_ejecutor: "{{ plan_pasos | interior_sin_driver }}"
      when: (pasos_sin_ejecutor | length) > 0

    # El plan se ejecuta EN ORDEN, paso a paso, y cada paso va por SU puerta (lo elige
    # `tasks/paso.yml` por el campo `via`). Un solo bucle, para que el orden del plan
    # sea el orden de verdad: si fueran dos bucles (uno para la API y otro para el
    # interior), el interior se haría al final, y el escalón 2 arrancaría antes de que
    # el escalón 1 esté convergido.
    - name: "APPLY · ejecutar el plan, paso a paso"
      ansible.builtin.include_tasks: ../tasks/paso.yml
      loop: "{{ plan_pasos }}"
      loop_control:
        label: "{{ item.orden }}/{{ plan_pasos | length }}  {{ item.accion }}"
      when: (plan_pasos | length) > 0

# La verificación va como segundo play, en la misma ejecución: `apply` converge Y
# comprueba. Es el mismo `verify.yml` que se puede lanzar solo -- y por eso no puede
# haber dos formas de verificar.
- name: "APPLY · verificación final del mismo verify.yml"
  ansible.builtin.import_playbook: verify.yml
