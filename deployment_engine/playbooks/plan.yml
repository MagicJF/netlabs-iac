---
# PROPÓSITO:   el verbo `plan`. Deriva y ORDENA las llamadas REST que llevarían el
#              mundo desde su estado actual hasta la declaración, y las escribe para
#              poder revisarlas. No toca nada.
# INVARIANTES: `apply` ejecuta ESTE plan. No existe una segunda lógica de decisión:
#              si el plan y lo que se ejecuta pudieran diferir, el plan no valdría
#              como revisión previa.
#              El estado del mundo sale de un fixture por defecto (clúster vacío
#              simulado) y de la API con `--api`: por eso `plan` es demostrable sin
#              credenciales y sin ningún Proxmox.
# LÍMITES:     el plan no prueba que una llamada vaya a funcionar. Ordena lo que hay
#              que pedir; que Proxmox lo acepte sólo lo dirá `apply`.
# VER:         README.md §Cómo se usa; labs/<lab>/<lab>.md

- name: "PLAN · qué pasos daría el motor, en qué orden"
  hosts: proxmox_api
  gather_facts: false
  vars_files:
    - ../vars/engine.yml
  tasks:
    - name: "PLAN · cargar la declaración del lab"
      ansible.builtin.include_vars:
        file: "{{ pve_archivo_lab }}"
        name: declaracion_cruda

    # La coherencia del estado deseado se comprueba igual en plan, preflight y
    # apply: es la misma tarea compartida, no tres copias que se separan con el tiempo.
    - name: "PLAN · validar la coherencia de la declaración"
      ansible.builtin.include_tasks: ../tasks/validar.yml

    # De aquí sale `estado` (del fixture o de la API) y `identidad` (rol -> vmid,
    # nombre, MAC). El asignador se re-deriva en cada ejecución: no hay estado en disco.
    - name: "PLAN · leer el mundo y asignar identidad"
      ansible.builtin.include_tasks: ../tasks/identidad.yml

    - name: "PLAN · parar si no hay estado del mundo"
      ansible.builtin.fail:
        msg: |-
          No se pudo leer el estado del mundo para el lab '{{ pve_lab }}':
            {{ pve_mundo_error | default('motivo desconocido') }}
          Sin saber qué hay, un plan sería una invención y no una previsión.
          (Sin credenciales, `plan` funciona contra el fixture: quita `--api`.)
      when: (pve_mundo_error | default('') | length) > 0

    # Lo que el motor sabe del entorno (no del lab): dónde, y con qué plantilla de
    # contenedor. Sale de secrets.yml y vars/engine.yml, nunca de una variable de entorno.
    # La clave PÚBLICA del camino se necesita ANTES de calcular el plan: el plan la
    # inyecta al CREAR el puesto de control (`ssh-public-keys`) y después ya no se
    # puede. `apply` puede generarla (es un verbo de escritura); `plan` y `preflight`
    # sólo la leen: mirar qué haría el motor no escribe nada, ni en su propia máquina.
    - name: "PLAN · preparar la clave del camino (antes de planificar)"
      ansible.builtin.include_tasks: ../tasks/camino.yml
      vars:
        camino_solo_clave: true
        camino_clave_generar: false
        camino_clave: "{{ engine_camino_clave_base }}_{{ pve_lab }}_ed25519"
      when: (declaracion.camino | default({}, true) | length) > 0

    - name: "PLAN · parámetros del entorno"
      ansible.builtin.set_fact:
        parametros_motor:
          # Sin credenciales no hay nodo que preguntar: se usa el nombre del mundo
          # simulado, y el texto del plan dice de dónde salió el estado. Con la API,
          # el nodo es `pve_nombre_nodo` (el nombre en Proxmox, no el host de la URL).
          nodo: "{{ pve_nombre_nodo | default(engine_nodo_simulado) }}"
          ostemplate_lxc: "{{ engine_ostemplate_lxc }}"
          comentario_pool: "topología gestionada por netlabs_v4_b (motor por API)"
          # La marca que el motor escribe en el `comments` de cada bridge que CREA:
          # es la prueba de propiedad que `destroy` busca antes de borrar un bridge
          # (Proxmox no mete interfaces de red en pools, así que no hay pool que valga).
          comentario_bridge: "{{ engine_plantilla_comentario_bridge }}"
          # El CAMINO (§5): por dónde sale el puesto de control hacia casa. Es ENTORNO
          # --la casa es una y los labs son muchos--, así que vive en secrets.yml y no
          # en la declaración de ningún lab. Vacío = este lab no tiene camino.
          bridge_gestion: "{{ pve_bridge_gestion | default('') }}"
          camino_host: "{{ pve_camino_salida_host | default('') }}"
          camino_puerto: "{{ pve_camino_salida_puerto | default(443) }}"
          camino_usuario: "{{ pve_camino_usuario | default('') }}"
          camino_puerto_base: "{{ engine_camino_puerto_base }}"
          camino_rest_puerto_base: "{{ engine_camino_rest_puerto_base }}"
          # El prefijo de las MAC: la identidad de un invitado con varias patas
          # sale de aquí (una MAC por pata, derivada del vmid; ver
          # `identidad_mac_de_pata`).
          mac_prefijo: "{{ engine_prefijo_mac }}"
          camino_clave: "{{ engine_camino_clave_base }}_{{ pve_lab }}_ed25519"
          rol_control: "{{ engine_rol_control }}"
          # Dónde vive la imagen de fábrica que importa una VM al nacer (el
          # contenido `import` del almacenamiento). Es del ENTORNO, no de ningún lab.
          almacenamiento_imagen: "{{ engine_almacenamiento_imagen }}"
          # La clave pública del camino, que lee `tasks/camino.yml` antes de planificar
          # y que el plan mete en la creación del puesto de control.
          camino_clave_publica: "{{ camino_clave_publica | default('') }}"

    # Si el camino YA responde, no hay que reconstruirlo: el plan no emitirá la mitad
    # `construir_camino` (regla 6). Se sondea AQUÍ, antes de planificar, y se deja en el
    # estado del mundo (es una lectura: un puerto que contesta no se puede fingir).
    - name: "PLAN · leer si el camino del lab ya está en pie"
      ansible.builtin.include_tasks: ../tasks/camino_mundo.yml

    - name: "PLAN · calcular el plan ordenado"
      ansible.builtin.set_fact:
        plan_pasos: "{{ declaracion | estado_plan(estado, identidad, parametros_motor) }}"

    - name: "PLAN · traducir el plan a texto"
      ansible.builtin.set_fact:
        plan_texto: "{{ plan_pasos | estado_plan_texto(declaracion, estado, identidad) }}"

    - name: "PLAN · guardar el plan (revisión y evidencia)"
      ansible.builtin.copy:
        content: "{{ plan_texto }}\n"
        dest: "{{ pve_carpeta_logs }}/plan.txt"
        mode: '0640'
      # Escribir en logs/ NO es cambiar el mundo: si lo fuera, la promesa de
      # idempotencia (regla 6) sería falsa por un fichero de log.
      changed_when: false

    - name: "PLAN · resumen"
      ansible.builtin.debug:
        msg: >-
          plan de '{{ pve_lab }}': {{ plan_pasos | length }} paso(s) por dar,
          estado del mundo leído de {{ pve_mundo_origen }}.
          Detalle en {{ pve_carpeta_logs }}/plan.txt
