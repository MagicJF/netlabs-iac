# ---------------------------------------------------------------------------
# 6.2 · LAS PRUEBAS FUNCIONALES del lab: `./lab --lab 08_dunder-mifflin-con-fw test`.
#
# Qué pregunta contestan aquí, en un lab CON CORTAFUEGOS: `verify` ya dice que cada
# `firewall` del lab es lo que la declaración dice que es (regla a regla). Lo que NO dice
# es si el filtrado DEJA PASAR lo que tiene que dejar pasar -- y eso es lo que se prueba.
#
# Todas se lanzan desde el BASTIÓN (el único invitado al que el motor llega: tiene túnel),
# y todas van al PLANO DE GESTIÓN de los cinco CHR, que es lo que sus tablas `input`
# permiten a la red de gestión. Un cortafuegos que filtrara de más y se dejara fuera al
# motor se vería aquí, y no en `verify`.
#
# LÍMITE CONOCIDO Y MEDIDO: el vocabulario de pruebas es `ping`/`servicio`/`dns`, que
# esperan ÉXITO. Este lab tiene una cosa que se debería poder probar y hoy no se puede
# decir: que el tráfico que DEBE caer, cae (por ejemplo, que desde el bastión NO se llega a
# la oficina: las tablas `forward` de `fw-oficina` lo tiran). Hace falta un tipo que espere
# un fallo (`bloqueado`), y todavía no existe.
# ---------------------------------------------------------------------------
tests:
  - nombre: el router contesta en la red de gestión
    desde: control
    tipo: ping
    hacia: 10.44.0.11
  - nombre: el cortafuegos de borde contesta en gestion
    desde: control
    tipo: ping
    hacia: 10.44.0.15
  - nombre: el cortafuegos de la oficina contesta en gestión
    desde: control
    tipo: ping
    hacia: 10.44.0.12
  - nombre: el cortafuegos del almacen contesta en gestion
    desde: control
    tipo: ping
    hacia: 10.44.0.13
  - nombre: el cortafuegos de los servidores contesta en gestion
    desde: control
    tipo: ping
    hacia: 10.44.0.14
  - nombre: el REST del router esta en pie
    desde: control
    tipo: servicio
    hacia: 10.44.0.11
    puerto: 80

# ---------------------------------------------------------------------------
# 6.4 · LOS EXPERIMENTOS sobre el lab complejo: mirar desde el bastión (que tiene una
# pata ahí) y estropear esa pata durante 15 s. El impairment se apaga solo.
#
# MEDIDO, y es una baza que conviene saber: el bastión NO pisa todos los bridges del lab.
# Su dotación es el de gestión más los que declara en `bridges:` -- y este bastión sólo
# declara el de gestión --, así que una captura pedida en la oficina no tendría desde dónde
# montarse: el motor la rechaza («el bastión no tiene una interfaz en el bridge ...»), y
# ahora el validador también, al leer la declaración. Se mide en gestión, igual que la
# línea base; medir DENTRO de una zona pide antes darle al bastión una pata ahí.
# ---------------------------------------------------------------------------
capture:
  bridge: vmb_fw_gestion
  filtro: icmp or arp
  segundos: 15

impairment:
  bridge: vmb_fw_gestion
  retardo: 300ms
  segundos: 15
