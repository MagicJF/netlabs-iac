---
# PROPÓSITO:   el verbo `preflight`. Sólo lectura: dice qué hay, qué falta y qué
#              difiere (DRIFT) entre la declaración y el mundo, ANTES de tocar nada.
# INVARIANTES: usa la MISMA comparación por conjuntos que `verify` (en los dos
#              sentidos), porque un preflight que midiera distinto que el test sería
#              una segunda fuente de verdad.
# LÍMITES:     un preflight de sólo lectura NO puede probar que una tarea de Proxmox
#              vaya a completarse. Dice lo que ve, y lo dice.
# VER:         README.md §Verificación; AGENTS.md §Qué correr y cuándo

- name: "PREFLIGHT · qué hay, qué falta, qué difiere"
  hosts: proxmox_api
  gather_facts: false
  vars_files:
    - ../vars/engine.yml
  tasks:
    - name: "PREFLIGHT · cargar la declaración del lab"
      ansible.builtin.include_vars:
        file: "{{ pve_archivo_lab }}"
        name: declaracion_cruda

    - name: "PREFLIGHT · validar la coherencia de la declaración"
      ansible.builtin.include_tasks: ../tasks/validar.yml

    # Lo PRIMERO, porque todo lo demás se apoya en el token: si el token puede
    # reescribir su propio rol, ninguna otra comprobación significa nada.
    - name: "PREFLIGHT · guarda de mínimos privilegios del token"
      ansible.builtin.include_tasks: ../tasks/guardia_privilegios.yml

    - name: "PREFLIGHT · leer el mundo y asignar identidad"
      ansible.builtin.include_tasks: ../tasks/identidad.yml

    - name: "PREFLIGHT · parar si no hay estado del mundo"
      ansible.builtin.fail:
        msg: |-
          No se pudo leer el estado del mundo para el lab '{{ pve_lab }}':
            {{ pve_mundo_error | default('motivo desconocido') }}
          Sin leer la API no hay preflight posible: lo único honesto es decirlo.
      when: (pve_mundo_error | default('') | length) > 0

    - name: "PREFLIGHT · comparar lo declarado con lo que hay"
      ansible.builtin.set_fact:
        informe: "{{ declaracion | estado_verificar(estado, identidad) }}"

    - name: "PREFLIGHT · parámetros del entorno"
      ansible.builtin.set_fact:
        parametros_motor:
          nodo: "{{ pve_nombre_nodo | default(pve_nodo) }}"
          ostemplate_lxc: "{{ engine_ostemplate_lxc }}"
          comentario_pool: "topología gestionada por netlabs_v4_b (motor por API)"
          # La marca que el motor escribe en el `comments` de cada bridge que CREA:
          # es la prueba de propiedad que `destroy` busca antes de borrar un bridge
          # (Proxmox no mete interfaces de red en pools, así que no hay pool que valga).
          comentario_bridge: "{{ engine_plantilla_comentario_bridge }}"
          # El CAMINO (§5): por dónde sale el puesto de control hacia casa. Es ENTORNO
          # --la casa es una y los labs son muchos--, así que vive en secrets.yml y no
          # en la declaración de ningún lab. Vacío = este lab no tiene camino.
          bridge_gestion: "{{ pve_bridge_gestion | default('') }}"
          camino_host: "{{ pve_camino_salida_host | default('') }}"
          camino_puerto: "{{ pve_camino_salida_puerto | default(443) }}"
          camino_usuario: "{{ pve_camino_usuario | default('') }}"
          camino_puerto_base: "{{ engine_camino_puerto_base }}"
          camino_clave: "{{ engine_camino_clave }}"
          rol_control: "{{ engine_rol_control }}"

    - name: "PREFLIGHT · cuántas llamadas haría apply"
      ansible.builtin.set_fact:
        plan_pasos: "{{ declaracion | estado_plan(estado, identidad, parametros_motor) }}"

    - name: "PREFLIGHT · guardar el informe"
      ansible.builtin.copy:
        content: >-
          {{ informe | estado_informe_texto }}

          El estado del mundo se leyó de {{ pve_mundo_origen }}.
          `apply` haría {{ plan_pasos | length }} llamada(s) REST más.
          (Un preflight de sólo lectura no puede probar que Proxmox vaya a aceptar
          cada una: eso se sabe al aplicar.)
        dest: "{{ pve_carpeta_logs }}/preflight.txt"
        mode: '0640'
      # Escribir en logs/ no es cambiar el mundo (ver plan.yml).
      changed_when: false

    - name: "PREFLIGHT · resumen"
      ansible.builtin.debug:
        msg: >-
          preflight de '{{ pve_lab }}': faltan={{ informe.faltan | length }}
          sobran={{ informe.sobran | length }} drift={{ informe.drift | length }}
          parados={{ informe.parados | length }} de_otro_lab={{ informe.otros_lab | length }}.
          Detalle en {{ pve_carpeta_logs }}/preflight.txt
