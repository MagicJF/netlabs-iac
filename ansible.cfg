# PROPÓSITO:   fija inventario y filtros del motor. Ansible lo busca en el
#              DIRECTORIO ACTUAL, por eso todos los verbos se lanzan con `./lab`.
# INVARIANTES: `filter_plugins` y `inventory` son rutas RELATIVAS a este fichero,
#              resueltas por Ansible respecto a la raíz del repo. Las colecciones
#              no se declaran aquí a propósito: el motor sólo usa ansible.builtin.
# LÍMITES:     este fichero no puede saber de qué lab es la ejecución, así que no
#              declara `log_path`. El log humano de cada lab lo redirige `./lab`.
# VER:         README.md §Verbos; docs/decisiones/0001-solo-api-de-proxmox.md

[defaults]
# El nodo Proxmox es un host local: el motor habla con su API, no entra por SSH.
inventory = deployment_engine/inventory/hosts.yml

# Los filtros que calculan la declaración, la identidad y el estado del mundo.
# Se declaran relativos a este fichero para que un clon nuevo funcione sin tocar
# el home de nadie.
filter_plugins = deployment_engine/filter_plugins

# Salida más corta: los `skipped` de un plan largo son ruido.
display_skipped_hosts = False

# Sin ficheros .retry: no aportan nada y ensucian el repo.
retry_files_enabled = False

# No intentes adivinar el intérprete del nodo: nunca ejecutamos nada en él.
interpreter_python = auto_silent

[inventory]
# El inventario no se cachea: cada verbo debe releer el inventario real.
cache = False
