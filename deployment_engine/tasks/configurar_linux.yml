---
# PROPÓSITO:   EL DRIVER DE UN LINUX. Un driver es un PROCEDIMIENTO con la misma forma
#              para todos los equipos de su tipo, y esa forma es siempre la misma:
#
#                 leer dentro -> decidir la diferencia (en los DOS sentidos) ->
#                 escribir lo que falta -> RELEER y comprobar.
#
#              Nada de «lanzar un comando y confiar»: lo que no se ha vuelto a leer no
#              está convergido. Y nada de decidir aquí: lo que hay que cambiar lo dice
#              `filter_plugins/interior.py` a partir de lo declarado y lo leído; este
#              fichero sólo pide, ejecuta y comprueba.
#
# INVARIANTES: abre la conexión SÓLO por la vía de acceso (`interior_ssh.yml`), que es quien
#              deja el diario. No escribe en ningún invitado por su cuenta. Si algo no
#              se pudo leer, PARA con el nombre del área en vez de escribir a ciegas.
#              Al final RELEE: un paso que escribe y no comprueba es una promesa.
# LÍMITES:     no instala aplicaciones que un lab haya declarado -- el vocabulario no
#              tiene paquetes (regla 15, §16) --. Lo que sí hace es poner en SU APARATO
#              (el bastión, que es del motor) lo que el área `dhcp_server`
#              necesita para existir: hoy `dnsmasq` y `ethtool`, porque se ha MEDIDO
#              que la imagen base no los trae y que `ip link` no sabe apagar los
#              offloads (ver docs/decisiones/0005 y la prosa del lab).
# VER:         docs/decisiones/0005-*.md; filter_plugins/interior.py;
#              tasks/interior_ssh.yml; tasks/guest_inventory.yml

# --- 0. POR DÓNDE SE ENTRA, y qué declara este invitado ------------------------------
# Se construye aquí (y la vía de acceso lo vuelve a construir antes de tocar la red: es
# barato y no abre nada). Sin esto no se sabe ni qué leer ni por dónde.
- name: "DRIVER LINUX · por dónde se entra a '{{ interior_rol }}' y qué declara"
  ansible.builtin.include_tasks: guest_inventory.yml

# --- 1. LO QUE EL LAB DECLARA, y por tanto lo que hay que preguntar -----------------
- name: "DRIVER LINUX · qué áreas hay que leer en '{{ interior_rol }}'"
  ansible.builtin.set_fact:
    interior_areas_declaradas: "{{ interior_declarado_guest | interior_areas }}"
  changed_when: false

# --- 2. LEER -------------------------------------------------------------------------
- name: "DRIVER LINUX · leer dentro de '{{ interior_rol }}'"
  ansible.builtin.include_tasks: interior_ssh.yml
  vars:
    interior_tipo: "linux"
    interior_comandos: "{{ interior_declarado_guest | interior_lecturas_linux }}"

- name: "DRIVER LINUX · qué se encontró dentro de '{{ interior_rol }}'"
  ansible.builtin.set_fact:
    interior_leido: "{{ interior_resultados | interior_leido(interior_declarado_guest) }}"
  changed_when: false

# ¿Se sigue adelante? En `solo_leer` (lo usa `verify` para mirar dentro sin tocar nada),
# sólo si de verdad se pudo leer: sin lectura no hay nada que comparar, y decidir sobre un
# «no se pudo» sería inventarse el estado. En el uso normal (converger) siempre se sigue.
# Va en su PROPIA tarea: un `set_fact` NO ve lo que él mismo está poniendo.
- name: "DRIVER LINUX · ¿se sigue adelante con '{{ interior_rol }}'?"
  ansible.builtin.set_fact:
    interior_seguir: >-
      {{ not (interior_solo_leer | default(false)) or (interior_leido.alcanzable | bool) }}
  changed_when: false

- name: "DRIVER LINUX · parar si al invitado no se le pudo PREGUNTAR"
  ansible.builtin.fail:
    msg: |-
      No se ha podido entrar en '{{ interior_rol }}' ({{ interior_declarado_guest.bridge }})
      para configurarlo: {{ interior_leido.motivo }}

      El motor no sigue a ciegas (regla 16). Si el invitado es el bastión, el
      túnel es lo primero: `./lab --lab {{ pve_lab }} apply` reconstruye el túnel si
      falta. Si no lo es, el que tiene que estar en pie es el bastión -- y por
      eso se entra a los invitados POR ÉL y no directamente.
  # En `solo_leer` NO se para: no poder leer es un RESULTADO que `verify` reporta como
  # «no comprobable» (regla 16: nunca a ciegas).
  when: not interior_leido.alcanzable and not (interior_solo_leer | default(false))

# --- 3. DECIDIR (función pura) --------------------------------------------------------
- name: "DRIVER LINUX · (declarado, leído) -> lo que hay que cambiar"
  ansible.builtin.set_fact:
    interior_pasos: >-
      {{ interior_declarado_guest
         | interior_pasos(identidad, declaracion, interior_leido, parametros_motor) }}
    interior_escrituras: >-
      {{ (interior_declarado_guest
          | interior_pasos(identidad, declaracion, interior_leido, parametros_motor)
          | interior_operaciones)
         | interior_escrituras_linux(interior_declarado_guest, declaracion, identidad, parametros_motor) }}
  when: interior_seguir
  changed_when: false

# Antes de tocar nada: lo que el plan pide y este driver NO sabe ejecutar. Sin esto, una
# operación sin traducir se caería de la lista y el motor diría «convergido» habiendo
# ignorado algo -- que es la forma más silenciosa de mentir. Se para ANTES de escribir,
# para no dejar el invitado a medio hacer.
- name: "DRIVER LINUX · parar si el plan pide algo que este driver no sabe hacer"
  ansible.builtin.fail:
    msg: |-
      El plan pide operaciones del interior que el driver de Linux todavía NO sabe
      ejecutar en '{{ interior_rol }}':

        {% for operacion in interior_sin_traducir %}- {{ operacion }}
        {% endfor %}

      {% if 'send_console_line' in interior_sin_traducir %}
      `send_console_line` quiere decir que el túnel de este lab NO está en pie, y eso
      no se arregla desde dentro de un invitado: lo pone la vía de acceso del túnel, por la
      consola del hipervisor, cuando ejecutas `./lab --lab {{ pve_lab }} apply`.
      {% endif %}
      No se ignora en silencio: se implementa la traducción en
      `filter_plugins/interior.py` (`escrituras_linux`) o se dice en voz alta que falta.
  vars:
    interior_sin_traducir: >-
      {{ interior_pasos | interior_operaciones
         | map('interior_pendiente_de_driver') | reject('none') | list }}
  when: interior_seguir and interior_sin_traducir | length > 0

- name: "DRIVER LINUX · lo que este invitado necesita, dicho en claro"
  ansible.builtin.debug:
    msg: >-
      '{{ interior_rol }}': {{ interior_pasos | length }} paso(s) --
      {% for paso in interior_pasos %}
      [{{ paso.parametros.area }}] {{ paso.porque.split(':')[0] }};
      {% endfor %}
  when: interior_seguir and interior_pasos | length > 0

# --- 4. ESCRIBIR ---------------------------------------------------------------------
- name: "DRIVER LINUX · escribir en '{{ interior_rol }}' lo que de verdad cambia"
  ansible.builtin.include_tasks: interior_ssh.yml
  vars:
    interior_tipo: "linux"
    interior_comandos: "{{ interior_escrituras }}"
  when: (not (interior_solo_leer | default(false))) and interior_escrituras | length > 0

# --- 5. RELEER y comprobar -----------------------------------------------------------
# Se vuelve a preguntar lo MISMO que se preguntó antes, y se decide otra vez: si queda
# alguna operación por hacer, no ha convergido. La comprobación no es «el comando no dio
# error» -- eso lo dice el diario -- sino «el estado real coincide con lo declarado».
- name: "DRIVER LINUX · releer '{{ interior_rol }}' después de escribir"
  ansible.builtin.include_tasks: interior_ssh.yml
  vars:
    interior_tipo: "linux"
    interior_comandos: "{{ interior_declarado_guest | interior_lecturas_linux }}"
  when: (not (interior_solo_leer | default(false))) and interior_escrituras | length > 0

- name: "DRIVER LINUX · comprobar que quedó como se declaró"
  ansible.builtin.set_fact:
    interior_pendiente: >-
      {{ (interior_declarado_guest
          | interior_pasos(identidad, declaracion,
             (interior_resultados | interior_leido(interior_declarado_guest)),
             parametros_motor)
          | interior_operaciones) }}
  when: (not (interior_solo_leer | default(false))) and interior_escrituras | length > 0
  changed_when: false

- name: "DRIVER LINUX · '{{ interior_rol }}' ha quedado como se declara"
  ansible.builtin.assert:
    # La comprobación de verdad es la REELECTURA (mismo caso que el driver de RouterOS: un
    # `fail` con `success_msg` no vale, esta versión de Ansible rechaza la opción y el verbo
    # se caería justo al ir bien -- medido).
    that: interior_pendiente | length == 0
    fail_msg: |-
      '{{ interior_rol }}' NO ha convergido en esta pasada: sigue habiendo
      {{ interior_pendiente | length }} operación(es) pendiente(s):

        {% for operacion in interior_pendiente %}- {{ operacion.op }}
        {% endfor %}

      Lo que pasó en cada paso está en {{ pve_carpeta_logs }}/interior.jsonl. No se
      repite a ciegas: se mira el diario y se arregla la causa (un paquete que no se
      pudo instalar, un servicio que no arrancó, una interfaz que no existe).
    success_msg: "'{{ interior_rol }}': comprobado leyendo dentro, y coincide con lo declarado."
  when: (not (interior_solo_leer | default(false))) and interior_escrituras | length > 0
