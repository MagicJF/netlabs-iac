---
# PROPÓSITO:   una declaración de juguete para los tests del asignador. NO es un
#              lab: vive en test/fixtures/ y por eso ni `./lab list` ni los checks
#              la miran.
# INVARIANTES: usa el mismo esquema que una declaración real (por eso declara `tipo:`
#              en cada invitado: sin él, el nombre no se puede derivar y la
#              declaración es incoherente).
# LÍMITES:     sus direcciones son de la RFC 5737 (rangos de documentación), como
#              las de los labs de ejemplo.
# VER:         test/test_identidad.py; docs/decisiones/0015-el-nombre-dice-que-es-el-equipo.md
lab:
  nombre: alfa
  stages: [1, 2]
  bridges:
    - nombre: vmb_alfa
      address: 192.0.2.1/24
vms:
  - rol: nucleo
    tipo: rt          # un router -> el nombre es 'rt-nucleo'
    stage: 1
    cores: 2
    memory: 512
    disk: 8
    bridge: vmb_alfa
    address: 192.0.2.2/24
containers:
  - rol: puesto-1
    tipo: ws          # un puesto -> 'ws-1'
    nombre: 1
    stage: 2
    cores: 1
    memory: 256
    disk: 4
    bridge: vmb_alfa
    address: 192.0.2.11/24
  - rol: puesto-2
    tipo: ws          # ...y el otro -> 'ws-2'
    nombre: 2
    stage: 2
    cores: 1
    memory: 256
    disk: 4
    bridge: vmb_alfa
    address: 192.0.2.12/24
