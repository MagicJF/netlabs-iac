---
# PROPÓSITO:   una declaración de juguete para los tests del asignador. NO es un
#              lab: vive en test/fixtures/ y por eso ni `./lab list` ni los checks
#              la miran.
# INVARIANTES: usa el mismo esquema que una declaración real.
# LÍMITES:     sus direcciones son de la RFC 5737 (rangos de documentación), como
#              las de los labs de ejemplo.
# VER:         test/test_identidad.py
lab:
  nombre: alfa
  escalones: [1, 2]
  bridges:
    - nombre: vmb_alfa
      direccion: 192.0.2.1/24
vms:
  - rol: nucleo
    escalon: 1
    cores: 2
    memoria: 512
    disco: 8
    bridge: vmb_alfa
    direccion: 192.0.2.2/24
containers:
  - rol: puesto-1
    escalon: 2
    cores: 1
    memoria: 256
    disco: 4
    bridge: vmb_alfa
    direccion: 192.0.2.11/24
  - rol: puesto-2
    escalon: 2
    cores: 1
    memoria: 256
    disco: 4
    bridge: vmb_alfa
    direccion: 192.0.2.12/24
