---
# PROPÓSITO:   declarar la topología del lab `lab-red-routeros`: el lab de ACEPTACIÓN
#              de la capa de configuración. Dos routers RouterOS (CHR) encadenados y
#              un puesto de control, con servidores y puestos como contenedores: es
#              lo que ejercita la cadena entera del arranque en frío -- el puesto de
#              control da la primera dirección, el primer CHR se configura por su
#              REST, el segundo escalón cuelga del primero, y los puestos obtienen su
#              dirección del CHR de su red (no de nadie de fuera).
# INVARIANTES: esta es la FUENTE DE VERDAD del lab. Aquí NO hay ningún vmid, ninguna
#              MAC y ninguna credencial: la identidad la deriva el motor (regla 11) y
#              la MAC de cada reserva DHCP se deriva del vmid del invitado que la
#              declara (regla 14). El nombre tiene que coincidir con el de la carpeta
#              (el pool de Proxmox se llama como la carpeta y es la frontera de
#              propiedad). Todo lo declarado cae dentro de `lab.supernet`.
# LÍMITES:     el interior que este lab declara está en el vocabulario CERRADO del
#              motor: para RouterOS, identidad, servicios, cliente del DHCP de
#              fábrica, direcciones, rutas y servidor DHCP; para Linux, el camino, la
#              dirección, el reenvío y el servidor DHCP. Las áreas que el encargo
#              nombra y el motor todavía no converge (puentes y cortafuegos de
#              RouterOS; pasarela, rutas, dns y claves de Linux) están DECLARADAS
#              como pendientes en `filter_plugins/interior.py` y la validación las
#              rechaza con su motivo: aquí no se declaran, para no fingir que se
#              configuran. Tampoco hay aplicaciones dentro de los invitados.
# VER:         labs/lab-red-routeros/lab-red-routeros.md;
#              docs/camino-del-puesto-de-control.md (el camino, paso a paso);
#              docs/decisiones/0004 (el token y la consola), 0005 (las áreas)

lab:
  nombre: lab-red-routeros

  # TRES escalones, y el orden es la mitad del diseño: primero el puesto de control
  # con el primer CHR (el que da y el que pide la primera dirección), después el
  # segundo escalón de la red --el segundo CHR y el servidor que cuelga del primero--
  # y sólo entonces los puestos dinámicos. Nunca se arranca un escalón antes de que
  # el anterior esté convergido y sirviendo (regla 18).
  escalones: [1, 2, 3]

  # Todo lo del lab vive aquí. Lo vigila `./lab check supernet`: dentro, todo lo
  # declarado cae dentro; fuera, dos labs no pueden declarar el mismo espacio.
  supernet: 10.40.0.0/16

  # Los bridges son del NODO, no del lab (Proxmox no mete interfaces en pools): el
  # motor crea los que falten, los marca al crearlos y `destroy` sólo borra los que
  # llevan su marca. Tres: la de gestión (por donde entra el puesto de control y por
  # donde los CHR piden su primera dirección) y una por cada LAN que sirve un CHR.
  bridges:
    - nombre: vmb_gestion
      direccion: 10.40.0.1/24
    - nombre: vmb_lan1
      direccion: 10.40.1.1/24
    - nombre: vmb_lan2
      direccion: 10.40.2.1/24

  # El camino lo construye el motor: un invitado con `config.linux.camino` sale hacia
  # casa por su cuenta y hace de bastión del lab. Por dónde sale (host y puerto) es
  # ENTORNO -- la casa es una y los labs son muchos -- así que vive en secrets.yml y
  # no aquí.
  camino: {tipo: puesto_control}

vms:
  # El primer CHR: la puerta de entrada del lab. Arranca SIN dirección y la pide por
  # DHCP; el puesto de control le tiene reservada (por su MAC derivada) exactamente
  # la dirección que aquí se declara, así que la petición y la declaración coinciden
  # sin que nadie escriba una MAC. Es tolerante: pide sin parar hasta que le
  # contestan, y por eso puede compartir escalón con el puesto de control.
  - rol: borde
    escalon: 1
    cores: 2
    memoria: 512
    disco: 1
    # La imagen de fábrica del CHR. Se adjunta SÓLO al crear el invitado: una imagen
    # importada no se puede añadir después (habría que recrear la VM).
    imagen: chr-7.25.1.raw
    # DOS patas, en este orden: la de gestión (por donde pide su primera dirección y por
    # donde el motor entra a configurarlo) y la LAN que sirve. El orden ES la numeración
    # de las interfaces: `vmb_gestion` -> ether1, `vmb_lan1` -> ether2. Por eso el motor
    # comprueba en la declaración que no se configure una interfaz que no exista.
    bridges: [vmb_gestion, vmb_lan1]
    direccion: 10.40.0.11/24
    config:
      routeros:
        identidad: rt-borde
        # `www` (que es donde vive REST) NO se toca: es el camino de vuelta. Si se
        # deshabilita, el equipo deja de poder ser configurado para siempre.
        servicios: {deshabilitar: [telnet, ftp, api, api-ssl]}
        # El cliente DHCP de fábrica, en ether1: se apaga DESPUÉS de tener la
        # dirección, porque mientras el motor no haya entrado es la única forma de
        # que el equipo sea alcanzable.
        cliente_dhcp: {deshabilitar: true}
        direcciones:
          - {interfaz: ether2, direccion: 10.40.1.1/24}
        rutas:
          - {destino: 0.0.0.0/0, pasarela: 10.40.0.1}
        dhcp:
          - interfaz: ether2
            pool: {rango: 10.40.1.100-10.40.1.200}
            red: {prefijo: 10.40.1.0/24, pasarela: 10.40.1.1, dns: [10.40.1.1]}
            # Las reservas no se escriben: se DERIVAN de las direcciones estáticas
            # que los demás invitados de esa red declaran. Así ningún cliente
            # dinámico puede robarle la dirección a un router o a un servidor.
            reservas: derivadas

  # El segundo CHR: cuelga de la LAN del primero. Su dirección es estática
  # declarada, y el primer CHR la tiene reservada por su MAC derivada -- por eso el
  # encadenamiento funciona: el que da la dirección está convergido antes de que
  # este arranque.
  - rol: nucleo
    escalon: 2
    cores: 1
    memoria: 512
    disco: 1
    imagen: chr-7.25.1.raw
    # Otra vez dos patas, y en orden: la del escalón anterior (por donde pide su
    # dirección y su ruta por defecto al primer CHR) y la LAN que sirve este.
    bridges: [vmb_lan1, vmb_lan2]
    direccion: 10.40.1.11/24
    config:
      routeros:
        identidad: rt-nucleo
        servicios: {deshabilitar: [telnet, ftp, api, api-ssl]}
        cliente_dhcp: {deshabilitar: true}
        direcciones:
          - {interfaz: ether2, direccion: 10.40.2.1/24}
        rutas:
          - {destino: 0.0.0.0/0, pasarela: 10.40.1.1}
        dhcp:
          - interfaz: ether2
            pool: {rango: 10.40.2.100-10.40.2.200}
            red: {prefijo: 10.40.2.0/24, pasarela: 10.40.2.1, dns: [10.40.2.1]}
            reservas: derivadas

containers:
  # El puesto de control: la única pata que el motor necesita para ENTRAR en el lab.
  # Nace con una pata en el bridge de gestión del NODO (valor de entorno, no del lab)
  # y una por cada bridge del lab, todas al nacer (cambiarle las patas a un invitado
  # en marcha obliga a reiniciarlo, y aquí no se reinicia la máquina que trabaja).
  # Su dirección en el bridge del nodo la DERIVA el motor de entre las libres.
  - rol: control
    escalon: 1
    cores: 1
    memoria: 512
    disco: 4
    bridge: vmb_gestion
    direccion: 10.40.0.10/24
    config:
      linux:
        # Vacío a propósito: que hay camino lo dice la clave, no su contenido. Por
        # dónde sale es entorno (secrets.yml).
        camino: {}
        # Las patas EXTRA del puesto de control, una por bridge del lab: `eth0` es la de
        # gestión (el campo `direccion`, arriba) y ésta es la LAN. El motor no adivina
        # direcciones (regla 11), y sin una aquí no alcanza a lo que cuelga de ese bridge
        # (medido: el CHR del segundo escalón, 10.40.1.11, no contesta al REST y su
        # convergencia no se puede ni empezar).
        direcciones:
          - interfaz: eth1
            direccion: 10.40.1.2/24
        # El que da la PRIMERA dirección: reserva, por la MAC derivada de cada CHR,
        # la dirección que ese CHR declara. Es lo que cierra el círculo del arranque
        # en frío.
        dhcp_servidor:
          interfaz: eth0
          rango: 10.40.0.50-10.40.0.99
          reservas: derivadas
        reenvio: true

  # Un servidor en la LAN del primer CHR: toma su dirección del DHCP del router, y
  # por eso se declara `dhcp` -- lo que se comprueba es que tiene dirección, que cae
  # dentro del rango declarado y que el router tiene una concesión para su MAC
  # derivada (las dos cosas, o no está verificado).
  - rol: servidor
    escalon: 2
    cores: 1
    memoria: 512
    disco: 4
    bridge: vmb_lan1
    direccion: dhcp
    config:
      linux: {}

  # Dos puestos dinámicos, cada uno detrás de un CHR distinto. No arrancan hasta que
  # su CHR está convergido y sirviendo: por eso el arranque en frío no depende de que
  # alguien lance las cosas en el orden correcto.
  - rol: puesto-1
    escalon: 3
    cores: 1
    memoria: 512
    disco: 4
    bridge: vmb_lan1
    direccion: dhcp
    config:
      linux: {}

  - rol: puesto-2
    escalon: 3
    cores: 1
    memoria: 512
    disco: 4
    bridge: vmb_lan2
    direccion: dhcp
    config:
      linux: {}
#     ↑ sin `vmid` y sin `mac`: los deriva el motor leyendo el estado del clúster.
