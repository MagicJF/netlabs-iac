---
# PROPÓSITO:   declarar la topología del lab `08_dunder-mifflin-con-fw`: la MISMA empresa
#              que `07_dunder-mifflin` (una sede con una oficina, un almacén y servidores),
#              pero con la red partida en ZONAS y cada zona protegida por su propio
#              CORTAFUEGOS. Es la versión que enseña lo que el 07 no podía: filtrado de
#              verdad (`/ip/firewall/filter`), y una máquina por responsabilidad -- un
#              router que enruta y sale, CUATRO cortafuegos que filtran, ninguna que haga
#              las dos cosas.
#
#              ESTA ES LA VERSIÓN POST de la comparación A/B del informe §6 sobre el LAB
#              COMPLEJO: la misma topología que la versión de `main`, declarando las P0
#              que este lab PUEDE declarar (`ready:` 6.3, `tests:` 6.2, `capture:` /
#              `impairment:` 6.4). NO declara `derived` (6.1) a propósito, y el motivo
#              está escrito abajo, donde estaban las direcciones.
# INVARIANTES: esta es la FUENTE DE VERDAD del lab. Aquí NO hay ningún vmid, ninguna MAC
#              y NINGUNA dirección de la red de casa: la identidad la deriva el motor
#              (regla 11) y la interfaz de fuera del router de salida toma su dirección,
#              su pasarela y sus DNS del estado del nodo, no de este fichero (ADR 0012:
#              `uplink` es una marca, por eso no lleva opciones).
#              El nombre tiene que coincidir con el de la carpeta (el pool de Proxmox se
#              llama como la carpeta y es la frontera de propiedad), y todo lo declarado
#              cae dentro de `lab.espacio de direcciones`.
#              El TIPO de cada equipo manda sobre lo que puede declarar (ADR 0026): un
#              `rt` no filtra, un `fw` no traduce ni reparte, un `sw` no enruta. Lo caza
#              el validador antes de tocar nada.
# LÍMITES:     el interior que este lab declara está en el vocabulario CERRADO del motor:
#              para RouterOS, identidad, servicios, cliente del DHCP de fábrica,
#              direcciones, rutas, servidor DHCP, exterior y CORTAFUEGOS; para Linux, el
#              túnel, la dirección, el reenvío y el servidor DHCP. Lo que el motor todavía
#              no converge (los `bridges` de RouterOS --una máquina QUE CONMUTE--; y
#              pasarela, rutas, dns y claves de Linux) está DECLARADO como pendiente en
#              `filter_plugins/interior.py` y la validación lo rechaza con su motivo: aquí
#              no se declara, para no fingir que se configura. Tampoco hay aplicaciones
#              dentro de los invitados.
# VER:         labs/08_dunder-mifflin-con-fw/08_dunder-mifflin-con-fw.md (por qué así);
#              docs/decisiones/0019-el-area-firewall-de-routeros.md (el área nueva);
#              docs/decisiones/0026-el-tipo-de-equipo-manda-sobre-las-areas.md (la regla);
#              docs/decisiones/0012-la-salida-del-lab.md (qué compra `uplink`);
#              docs/crear-un-lab.md (las decisiones, en orden)
#
# LA EMPRESA, EN UNA LÍNEA: una sede con UNA salida a internet, un router que enruta y
# sale, un CORTAFUEGOS DE PERÍMETRO por el que pasa todo lo que entra o sale, y TRES zonas
# (oficina, almacén y servidores) con un cortafuegos delante de cada una. El troncal --la
# red por la que el borde habla con los tres cortafuegos de zona-- es el eje: por él
# pasa todo lo que va de una zona a otra o hacia fuera, y ninguna zona habla con otra si su
# cortafuegos no lo permite.
#
# UNA MÁQUINA, UNA RESPONSABILIDAD (regla del encargo, y desde ADR 0026 también una regla
# del VALIDADOR): `rt-nucleo` enruta y sale (y nada más: no tiene tabla de filtrado);
# `fw-borde`, `fw-oficina`, `fw-almacen` y `fw-servidores` filtran, y nada más. Por eso
# los puestos y los servidores llevan su dirección puesta a mano (`address:` + `gateway:`)
# en vez de pedirla: repartir direcciones sería una TERCERA responsabilidad, y para que un
# cortafuegos la tuviera habría que meterle un servidor DHCP que no le toca.

lab:
  nombre: 08_dunder-mifflin-con-fw

  # Dos etapas. La primera es la INFRAESTRUCTURA (el bastión con su túnel, el router, el
  # borde y los tres cortafuegos de zona): hasta que el router no está convergido y
  # sirviendo, nadie de dentro puede salir. La segunda son los hosts, que ya saben por
  # dónde (llevan su pasarela).
  stages: [1, 2]

  # Espacio propio y libre: los cuatro labs con interior usan 10.40, 10.41, 10.42 y 10.43.
  # Lo vigila `./lab check address-space`.
  address_space: 10.44.0.0/16

  # Seis bridges: el de gestión (por donde entra el motor) y uno por red del lab. El
  # `address:` de un bridge es la PASARELA de esa red (no se le pone al nodo: el nodo sólo
  # presta la interfaz), y es lo que usan los checks para saber quién es quién.
  #
  # EL CONMUTADOR SIGUE SIN SER UN INVITADO: un bridge de Linux conmuta (aprende MACs y
  # reenvía), así que una caja que "conmuta" sería una caja que no hace nada. El
  # vocabulario del interior no tiene `puentes` y el validador lo rechaza. Y el día que lo
  # tenga, no podrá caer en un `rt` ni en un `fw`: conmutar no es enrutar ni filtrar
  # (ADR 0026), y eso ya lo caza el validador.
  #
  # 6.1 · AQUÍ `derived` NO SE DECLARA, y es una decisión medida, no una omisión: el
  # direccionamiento de este lab es un PLAN (el borde en 10.44.20.x, el troncal en
  # 10.44.10.x, la DMZ en .3.x, los cortafuegos en .12/.13/.14/.15) y las rutas apuntan a
  # direcciones concretas de ese plan (10.44.10.10/.11/.12, 10.44.20.2). El IPAM reparte
  # subredes /24 EN ORDEN desde el espacio del lab, así que el troncal --que hoy es la
  # SEGUNDA subred-- pasaría a ser la sexta, y las rutas (que sí se quedan escritas,
  # porque el motor no puede adivinar a quién apuntan) apuntarían a direcciones que ya no
  # existen. En un lab con plan de direccionamiento, `derived` no es «menos YAML»: es
  # renumerar el plan.
  bridges:
    - nombre: vmb_fw_gestion
      address: 10.44.0.1/24
    - nombre: vmb_fw_borde
      address: 10.44.20.1/24
    - nombre: vmb_fw_troncal
      address: 10.44.10.254/24
    - nombre: vmb_fw_oficina
      address: 10.44.1.1/24
    - nombre: vmb_fw_almacen
      address: 10.44.2.1/24
    - nombre: vmb_fw_dmz
      address: 10.44.3.1/24

  # El túnel lo construye el motor: el invitado con `config.linux.túnel` sale hacia casa y
  # hace de bastión. Por dónde sale es ENTORNO (vive en secrets.yml), no del lab.
  tunnel: {tipo: bastion}

vms:
  # EL ROUTER: su única responsabilidad es ENRUTAR y SALIR. Tiene la vía de acceso
  # (`uplink`: cliente DHCP en la interfaz de fuera, MASQUERADE por ella y el resolutor
  # encendido) y las rutas hacia dentro, que está DETRÁS del cortafuegos de borde.
  #
  # NO TIENE TABLA DE FILTRADO, y eso es el cambio: hasta ADR 0026 llevaba una («no es su
  # trabajo, pero un equipo con una pata en internet no se queda abierto»), y era
  # exactamente el router con dos trabajos que el encargo prohíbe. El filtrado del borde
  # vive ahora en `fw-borde`, que es un equipo cuya RESPONSABILIDAD es filtrar.
  #
  # Dos interfaces declaradas (gestión y borde); la tercera la tiende el motor al nacer
  # sobre el bridge del nodo que tiene salida (valor de ENTORNO, `pve_bridge_gestion`).
  - rol: nucleo
    tipo: rt          # un router CHR -> 'rt-nucleo'
    stage: 1
    cores: 2
    memory: 512
    disk: 1
    image: chr-7.25.1.raw
    # TRES interfaces, y el orden ES la numeración: vmb_fw_gestion -> ether1 (gestión),
    # vmb_fw_borde -> ether2, y la de fuera (que añade el motor) -> ether3.
    bridges: [vmb_fw_gestion, vmb_fw_borde]
    address: 10.44.0.11/24
    # 6.3 · La barrera DECLARADA: un CHR tarda en arrancar, y esto dice cuánto se le
    # espera en SEGUNDOS (antes era un número del motor, metido en `engine.yml`).
    ready: {tipo: routeros_rest, espera: 240}
    config:
      routeros:
        identity: rt-nucleo
        # VIGILADO por SNMP (área `snmp`): el motor enciende su agente y le pone la
        # comunidad de LECTURA del motor, la misma con la que el servidor de vigilancia
        # (rol `monitor`) pregunta a la red de gestión. Sin esto el equipo es mudo al SNMP.
        snmp: {}
        ip_services: {deshabilitar: [telnet, ftp, api, api-ssl]}
        dhcp_client: {deshabilitar: true}
        addresses:
          - {interface: ether2, address: 10.44.20.1/24}
        # Una ruta por red de dentro, y todas apuntan al PERÍMETRO: el router no habla con
        # las zonas ni con el troncal, habla con el cortafuegos que guarda la puerta.
        routes:
          - {dst_address: 10.44.10.0/24, gateway: 10.44.20.2}
          - {dst_address: 10.44.1.0/24, gateway: 10.44.20.2}
          - {dst_address: 10.44.2.0/24, gateway: 10.44.20.2}
          - {dst_address: 10.44.3.0/24, gateway: 10.44.20.2}
        uplink: {}

  # EL CORTAFUEGOS DE PERÍMETRO: el que decide qué entra de internet al lab y qué sale.
  # Filtra y nada más: no traduce, no reparte direcciones y no es la vía de acceso de nadie
  # (la de acceso es el router). Está EN LÍNEA entre el router y el troncal, así que todo
  # lo que va de fuera hacia dentro -- y al revés -- pasa por su tabla `forward`.
  #
  # Tiene una dirección por pata y una ruta por defecto hacia el router: eso es lo mínimo
  # para estar en línea, no una segunda función (igual que los tres cortafuegos de zona).
  - rol: borde
    tipo: fw          # cortafuegos: un CHR -> 'fw-borde'
    stage: 1
    cores: 2
    memory: 512
    disk: 1
    image: chr-7.25.1.raw
    bridges: [vmb_fw_gestion, vmb_fw_borde, vmb_fw_troncal]
    address: 10.44.0.15/24
    ready: {tipo: routeros_rest, espera: 240}
    config:
      routeros:
        identity: fw-borde
        # VIGILADO por SNMP (área `snmp`): el motor enciende su agente y le pone la
        # comunidad de LECTURA del motor, la misma con la que el servidor de vigilancia
        # (rol `monitor`) pregunta a la red de gestión. Sin esto el equipo es mudo al SNMP.
        snmp: {}
        ip_services: {deshabilitar: [telnet, ftp, api, api-ssl]}
        dhcp_client: {deshabilitar: true}
        addresses:
          - {interface: ether2, address: 10.44.20.2/24}
          - {interface: ether3, address: 10.44.10.254/24}
        routes:
          - {dst_address: 0.0.0.0/0, gateway: 10.44.20.1}
          - {dst_address: 10.44.1.0/24, gateway: 10.44.10.10}
          - {dst_address: 10.44.2.0/24, gateway: 10.44.10.11}
          - {dst_address: 10.44.3.0/24, gateway: 10.44.10.12}
        # LA POLÍTICA DEL BORDE, entera y en orden: al borde no se le entra (salvo
        # desde gestión, que es por donde vive el túnel del motor); lo que sale del lab,
        # sale; y lo que viene de fuera hacia dentro, no pasa.
        firewall:
          - {chain: input, action: accept, src_address: 10.44.0.0/24,
             comment: "la red de gestion entra: por ahi vive el tunel del motor"}
          - {chain: input, action: accept, protocol: icmp, comment: "ping, para diagnostico"}
          - {chain: input, action: accept, connection_state: "established,related"}
          - {chain: input, action: drop, comment: "al borde, por lo demas, no se le entra"}
          - {chain: forward, action: accept, connection_state: "established,related"}
          - {chain: forward, action: accept, in_interface: ether3,
             comment: "lo que viene del troncal sale a internet"}
          - {chain: forward, action: drop, comment: "y lo que viene de internet no entra"}

  # EL CORTAFUEGOS DE LA OFICINA: no enruta nada que no sea pasar a la oficina, no traduce,
  # no reparte direcciones. Filtra. Su pata de gestión (ether1) NO es una vía de servicio:
  # está para que el motor lo configure, y su tabla de entrada lo dice. Su salida ya no es
  # el router: es el PERÍMETRO, que es quien guarda la puerta de la empresa.
  - rol: oficina
    tipo: fw          # cortafuegos: un CHR -> 'fw-oficina'
    stage: 1
    cores: 2
    memory: 512
    disk: 1
    image: chr-7.25.1.raw
    bridges: [vmb_fw_gestion, vmb_fw_troncal, vmb_fw_oficina]
    address: 10.44.0.12/24
    ready: {tipo: routeros_rest, espera: 240}
    config:
      routeros:
        identity: fw-oficina
        # VIGILADO por SNMP (área `snmp`): el motor enciende su agente y le pone la
        # comunidad de LECTURA del motor, la misma con la que el servidor de vigilancia
        # (rol `monitor`) pregunta a la red de gestión. Sin esto el equipo es mudo al SNMP.
        snmp: {}
        ip_services: {deshabilitar: [telnet, ftp, api, api-ssl]}
        dhcp_client: {deshabilitar: true}
        addresses:
          - {interface: ether2, address: 10.44.10.10/24}
          - {interface: ether3, address: 10.44.1.1/24}
        routes:
          - {dst_address: 0.0.0.0/0, gateway: 10.44.10.254}
        firewall:
          - {chain: input, action: accept, src_address: 10.44.0.0/24,
             comment: "la red de gestion entra: por ahi vive el tunel del motor"}
          - {chain: input, action: accept, protocol: icmp}
          - {chain: input, action: accept, connection_state: "established,related"}
          - {chain: input, action: drop, comment: "al cortafuegos no se le entra por su cara de dentro"}
          - {chain: forward, action: accept, connection_state: "established,related"}
          - {chain: forward, action: accept, in_interface: ether3,
             comment: "la oficina sale por el troncal (y de ahi, el borde la saca)"}
          - {chain: forward, action: accept, protocol: icmp, src_address: 10.44.0.0/24,
             dst_address: 10.44.1.0/24,
             comment: "la vigilancia sondea la zona: se deja pasar su ICMP desde la red de gestion"}
          - {chain: forward, action: drop, comment: "de fuera hacia la oficina, nada: cada zona se pide"}

  # EL CORTAFUEGOS DEL ALMACÉN: misma forma, otra zona.
  - rol: almacen
    tipo: fw          # -> 'fw-almacen'
    stage: 1
    cores: 2
    memory: 512
    disk: 1
    image: chr-7.25.1.raw
    bridges: [vmb_fw_gestion, vmb_fw_troncal, vmb_fw_almacen]
    address: 10.44.0.13/24
    ready: {tipo: routeros_rest, espera: 240}
    config:
      routeros:
        identity: fw-almacen
        # VIGILADO por SNMP (área `snmp`): el motor enciende su agente y le pone la
        # comunidad de LECTURA del motor, la misma con la que el servidor de vigilancia
        # (rol `monitor`) pregunta a la red de gestión. Sin esto el equipo es mudo al SNMP.
        snmp: {}
        ip_services: {deshabilitar: [telnet, ftp, api, api-ssl]}
        dhcp_client: {deshabilitar: true}
        addresses:
          - {interface: ether2, address: 10.44.10.11/24}
          - {interface: ether3, address: 10.44.2.1/24}
        routes:
          - {dst_address: 0.0.0.0/0, gateway: 10.44.10.254}
        firewall:
          - {chain: input, action: accept, src_address: 10.44.0.0/24,
             comment: "la red de gestion entra: por ahi vive el tunel del motor"}
          - {chain: input, action: accept, protocol: icmp}
          - {chain: input, action: accept, connection_state: "established,related"}
          - {chain: input, action: drop}
          - {chain: forward, action: accept, connection_state: "established,related"}
          - {chain: forward, action: accept, in_interface: ether3,
             comment: "el almacen sale por el troncal"}
          - {chain: forward, action: accept, protocol: icmp, src_address: 10.44.0.0/24,
             dst_address: 10.44.2.0/24,
             comment: "la vigilancia sondea la zona: se deja pasar su ICMP desde la red de gestion"}
          - {chain: forward, action: drop}

  # EL CORTAFUEGOS DE LOS SERVIDORES: es el ESTRECHO -- y por eso es el que enseña lo que
  # un cortafuegos es. La DMZ no inicia NADA hacia fuera; sólo se le entra por https (y por
  # http, para el redireccionamiento). Todo lo demás cae.
  - rol: servidores
    tipo: fw          # -> 'fw-servidores'
    stage: 1
    cores: 2
    memory: 512
    disk: 1
    image: chr-7.25.1.raw
    bridges: [vmb_fw_gestion, vmb_fw_troncal, vmb_fw_dmz]
    address: 10.44.0.14/24
    ready: {tipo: routeros_rest, espera: 240}
    config:
      routeros:
        identity: fw-servidores
        # VIGILADO por SNMP (área `snmp`): el motor enciende su agente y le pone la
        # comunidad de LECTURA del motor, la misma con la que el servidor de vigilancia
        # (rol `monitor`) pregunta a la red de gestión. Sin esto el equipo es mudo al SNMP.
        snmp: {}
        ip_services: {deshabilitar: [telnet, ftp, api, api-ssl]}
        dhcp_client: {deshabilitar: true}
        addresses:
          - {interface: ether2, address: 10.44.10.12/24}
          - {interface: ether3, address: 10.44.3.1/24}
        routes:
          - {dst_address: 0.0.0.0/0, gateway: 10.44.10.254}
        firewall:
          - {chain: input, action: accept, src_address: 10.44.0.0/24,
             comment: "la red de gestion entra: por ahi vive el tunel del motor"}
          - {chain: input, action: accept, protocol: icmp}
          - {chain: input, action: accept, connection_state: "established,related"}
          - {chain: input, action: drop}
          - {chain: forward, action: accept, connection_state: "established,related"}
          - {chain: forward, action: accept, protocol: tcp, dst_address: 10.44.3.10, dst_port: 443,
             comment: "al servidor web, solo por https"}
          - {chain: forward, action: accept, protocol: tcp, dst_address: 10.44.3.10, dst_port: 80,
             comment: "y por http, para el redireccionamiento"}
          - {chain: forward, action: accept, protocol: icmp, src_address: 10.44.0.0/24,
             dst_address: 10.44.3.0/24,
             comment: "la vigilancia sondea la zona: se deja pasar su ICMP desde la red de gestion"}
          - {chain: forward, action: drop, comment: "la DMZ no inicia nada: lo demas cae"}

containers:
  # El bastión: la única puerta que el motor necesita para ENTRAR. Vive en el bridge de
  # gestión, da la PRIMERA dirección (reservas derivadas de las MAC de los CINCO CHR) y
  # reenvía. NO es un router de la empresa: no traduce y no sale.
  - rol: control
    tipo: ctl         # un bastión -> 'ctl-1'
    nombre: 1
    stage: 1
    cores: 1
    memory: 512
    disk: 4
    bridge: vmb_fw_gestion
    address: 10.44.0.10/24
    ready: {tipo: ssh, espera: 120}
    config:
      linux:
        tunnel: {}
        dhcp_server:
          interface: eth0
          rango: 10.44.0.50-10.44.0.99
          static_leases: derived
          # La ÚNICA red que se reparte sola es la de gestión (sus clientes de fábrica son
          # los cinco CHR, hasta que el motor les pone su dirección). Y anuncia el
          # resolutor del router -- `rt-nucleo` resuelve por la vía de acceso-- para que
          # nadie del lab tenga que hablar con un DNS de fuera.
          network: {address: 10.44.0.0/24, gateway: 10.44.0.10, dns: [10.44.0.11]}
        ip_forward: true

  # EL SERVIDOR DE VIGILANCIA: un NetXMS que pregunta a los equipos de red por SNMP y
  # dibuja la topología del lab. Va en el bridge de GESTIÓN, que es la ÚNICA red que los
  # cinco equipos de red comparten (cada uno tiene ahí su ether1 de gestión) y la que su
  # tabla de entrada ya da por buena (`accept src-address=10.44.0.0/24`): así ve a todos
  # los vigilados sin abrir un solo boquete y sin depender de ningún router del lab.
  # NO es el bastión: es un invitado APARTE, con su pata de gestión hacia fuera (por ahí se
  # entra en su web y se alcanza el repositorio para instalarlo), pero sin tocar el túnel.
  - rol: monitor
    tipo: ctl         # -> 'ctl-2'
    nombre: 2
    stage: 2          # después de los equipos de red: cuando ronda la red, ya contestan
    cores: 2
    memory: 1536
    disk: 6
    bridge: vmb_fw_gestion
    address: 10.44.0.20/24
    ready: {tipo: ssh, espera: 120}
    config:
      linux:
        servicio: netxms
        # EL CAMINO hacia las zonas: sin esto el vigilante solo alcanza su propia red (la de
        # gestión) y los invitados de las zonas -- que cuelgan de los cortafuegos -- no se
        # ven. Son rutas ESTÁTICAS (`dst_address` + `gateway`), el mismo vocabulario que un
        # CHR: el motor las aplica y las lee, y con ellas el rango de descubrimiento (que el
        # motor DERIVA de estas rutas, no de un valor escrito) cubre las tres zonas. Cada
        # pasarela es la pata de gestión del cortafuegos de su zona.
        routes:
          - {dst_address: 10.44.1.0/24, gateway: 10.44.0.12}
          - {dst_address: 10.44.2.0/24, gateway: 10.44.0.13}
          - {dst_address: 10.44.3.0/24, gateway: 10.44.0.14}
        # Que el servidor SEPA a quién vigilar: ronda por SNMP las redes que ALCANZA (la suya
        # y las de sus rutas de arriba) y añade lo que responde. El CÓMO es del motor; el lab
        # sólo declara que este servidor vigila.
        monitorizacion: {}

  # EL SERVIDOR DE FICHEROS DE LA OFICINA: dirección y pasarela a mano. Su pasarela es su
  # CORTAFUEGOS (`fw-oficina`, 10.44.1.1), que es quien lo saca. No se entra en él.
  #
  # 6.3 · `ready: {tipo: ninguno}` -- estos cinco hosts NO declaran `config:` (no se entra
  # en ellos), y antes un invitado sin `config:` no podía decir NADA sobre su barrera: el
  # motor no insinuaba ninguna y el lab no tenía forma de pedirla. Ahora el lab dice
  # explícitamente que a éste no se le espera porque no ofrece nada por lo que preguntarle.
  - rol: ficheros
    tipo: srv         # -> 'srv-1'
    nombre: 1
    stage: 2
    cores: 1
    memory: 512
    disk: 8
    bridge: vmb_fw_oficina
    address: 10.44.1.10/24
    gateway: 10.44.1.1
    # `ready: ssh` porque ahora SÍ se entra en él: el latido hay que instalarlo DENTRO.
    ready: {tipo: ssh, espera: 180}
    config:
      linux:
        # EL LATIDO: este equipo tiene que VERSE en la topología de la vigilancia sin que
        # nadie tenga que preguntarle a él. No configura nada suyo ni abre nada en la red:
        # da un toque a su pasarela cada poco (2 min, el defecto del motor) y con eso su MAC
