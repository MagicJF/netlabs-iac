---
# PROPÓSITO:   el DESPACHADOR de un paso del plan. Mira por qué VÍA va el paso (`via`)
#              y llama a la vía de acceso que le toca: la API del hipervisor, el túnel, el
#              interior de un invitado o la sonda de un etapa. Es el único sitio del
#              motor donde un paso del plan se convierte en llamadas.
# INVARIANTES: el plan se ejecuta EN ORDEN, paso a paso: por eso el bucle vive en el
#              verbo y aquí sólo se elige la vía de acceso, sin reordenar nada. Un paso sin
#              ejecutor PARA el verbo diciendo cuál es -- no se salta en silencio, ni
#              se rodea por otra vía (regla 16). Ninguna vía de acceso se abre desde aquí:
#              aquí sólo se llama a la que ya existe.
# LÍMITES:     no decide nada sobre el estado del mundo: el plan ya lo decidió. Si un
#              paso llega aquí, es porque hay que darlo.
# VER:         deployment_engine/tools/plan.py (las acciones y su `via`);
#              AGENTS.md §Reglas duras (12: cuatro vías de acceso); README.md §Arquitectura

# `item` es el paso del plan que el verbo está recorriendo (lo pasa el bucle).

# Antes de CREAR, se PREGUNTA si ese vmid ya lo ocupa un invitado NUESTRO. La creación es
# la única escritura que un reintento no perdona: reintentarla crea un GEMELO con el vmid
# siguiente (medido en un `apply` en frío real: dos CT para un rol). Si la respuesta dice
# que el vmid ya es de este lab y de este rol, el paso está dado y se salta; si está libre
# --o lo ocupa un invitado ajeno, sin nuestra marca-- se crea, y un choque ajeno lo
# resuelve el reintento de `converger` como siempre.
- name: "PASO {{ item.orden }} · ¿el vmid {{ item.parametros.vmid | default(0) }} ya es nuestro invitado?"
  ansible.builtin.include_tasks: ../tasks/pve_api.yml
  vars:
    pve_api_metodo: GET
    pve_api_ruta: "{{ item.ruta }}/{{ item.parametros.vmid }}/config"
    # 404/500 = «ese invitado no está»: es la respuesta ESPERADA cuando toca crear, no un
    # error del que haya que avisar. Se tolera y se decide con ella (es_guest_del_lab).
    pve_api_tolerar_error: true
    pve_api_etiqueta: "guarda antes de crear: ¿el vmid {{ item.parametros.vmid | default(0) }} ya es nuestro?"
  when:
    - (item.via | default('api')) == 'api'
    - item.accion == 'crear_guest'

- name: "PASO {{ item.orden }} · anotar si el vmid ya es nuestro invitado"
  ansible.builtin.set_fact:
    pve_vmid_ya_es_nuestro: >-
      {{ (pve_api_ultimo_status | int == 200)
         and ((pve_api_ultimo_datos.get('description', '') | default('', true))
              | es_guest_del_lab(pve_lab, item.rol)) }}
  when:
    - (item.via | default('api')) == 'api'
    - item.accion == 'crear_guest'

- name: "PASO {{ item.orden }} · por la API de Proxmox: {{ item.metodo }} {{ item.ruta }}"
  ansible.builtin.include_tasks: ../tasks/pve_api_y_esperar.yml
  vars:
    pve_api_metodo: "{{ item.metodo }}"
    pve_api_ruta: "{{ item.ruta }}"
    pve_api_cuerpo: "{{ item.parametros }}"
    pve_api_etiqueta: "paso {{ item.orden }}: {{ item.accion }} -- {{ item.porque }}"
  when:
    - (item.via | default('api')) == 'api'
    # Y la guarda: crear no se da si el vmid ya es nuestro (el paso está dado).
    - not (item.accion == 'crear_guest' and (pve_vmid_ya_es_nuestro | default(false) | bool))

- name: "PASO {{ item.orden }} · por el TÚNEL del lab: {{ item.accion }}"
  ansible.builtin.include_tasks: ../tasks/tunnel.yml
  vars:
    tunnel_rol: "{{ item.rol }}"
    tunnel_vmid: "{{ item.parametros.vmid }}"
    tunnel_tipo: >-
      {{ (identidad.guests | selectattr('rol', 'equalto', item.rol) | first).tipo }}
    tunnel_puerto: "{{ item.parametros.puerto }}"
    tunnel_rest: "{{ item.parametros.rest | default([]) }}"
    tunnel_salida_host: "{{ item.parametros.salida_host }}"
    tunnel_salida_puerto: "{{ item.parametros.salida_puerto }}"
    tunnel_usuario: "{{ parametros_motor.tunnel_usuario }}"
    tunnel_clave: "{{ parametros_motor.tunnel_clave }}"
    tunnel_solo_comprobar: "{{ item.accion == 'comprobar_tunnel' }}"
  when: (item.via | default('api')) == 'tunnel'

# El INTERIOR: cada tipo tiene su driver, y el tipo lo dice la DECLARACIÓN (nunca lo
# adivina el motor, §3). El driver lee, decide, escribe y RELEE por su pasarela -- aquí
# sólo se elige cuál. Si añades una rama aquí, añade su tipo a `DRIVERS`
# (`filter_plugins/interior.py`): es lo que usa `apply` para avisar de lo que no sabe
# hacer, y `test/test_interior.py` comprueba que las dos listas cuadran.
- name: "PASO {{ item.orden }} · INTERIOR de '{{ item.rol }}' ({{ item.parametros.tipo }}): {{ item.parametros.area | default('todo lo declarado') }}"
  ansible.builtin.include_tasks: ../tasks/configurar_linux.yml
  vars:
    interior_rol: "{{ item.rol }}"
    interior_porque: "{{ item.porque }}"
  when:
    - (item.via | default('api')) == 'interior'
    - (item.parametros.tipo | default('')) == 'linux'

- name: "PASO {{ item.orden }} · INTERIOR de '{{ item.rol }}' (RouterOS): {{ item.parametros.area | default('todo lo declarado') }}"
  ansible.builtin.include_tasks: ../tasks/configurar_routeros.yml
  vars:
    interior_rol: "{{ item.rol }}"
    interior_porque: "{{ item.porque }}"
  when:
    - (item.via | default('api')) == 'interior'
    - (item.parametros.tipo | default('')) == 'routeros'

# La SONDA del etapa: que un etapa SIRVA de verdad antes de tocar el siguiente (regla
# 18). Mira y no cambia nada: pregunta en la dirección declarada, desde el puesto de
# control, y si no contesta se para con el nombre del rol.
- name: "PASO {{ item.orden }} · SONDA del etapa {{ item.stage }}: ¿sirve '{{ item.rol }}'?"
  ansible.builtin.include_tasks: ../tasks/sonda.yml
  vars:
    sonda_rol: "{{ item.rol }}"
    sonda_stage: "{{ item.stage }}"
    sonda_tipo: "{{ item.parametros.tipo }}"
    sonda_direccion: "{{ item.parametros.address }}"
    sonda_puerto: "{{ item.parametros.puerto }}"
    # 6.3 · La ventana que declara el lab (en segundos, ya traducida a intentos por
    # `espera_de_servicio`). Sin declararla, la del motor (ADR 0021).
    #
    # `default(..., true)` con el `true`: sin él, un `None` NO dispara el `default` (Jinja
    # sólo sustituye lo INDEFINIDO), y el tope llegaba a la sonda como cadena VACÍA. El
    # comando quedaba en `while [ $i -lt  ]`, que es un error de shell: la barrera no podía
    # pasar NUNCA, tardara lo que tardara el invitado. Medido en un `apply` en frío real.
    sonda_intentos: "{{ item.parametros.intentos | default(engine_sonda_intentos, true) }}"
    sonda_porque: "{{ item.porque }}"
  when: (item.via | default('api')) == 'sonda'

# Y lo que este motor TODAVÍA no sabe ejecutar para aquí, con su nombre en la boca: es la
# vía o el tipo que no tiene ejecutor --no la capa, que ya está construida--, dicho en voz
# alta (nunca se salta un paso en silencio).
- name: "PASO {{ item.orden }} · parar si este paso no tiene ejecutor todavía"
  ansible.builtin.fail:
    msg: |-
      El plan del lab '{{ pve_lab }}' tiene un paso que este motor TODAVÍA no sabe
      ejecutar, y se ha parado aquí a propósito (no se salta nada en silencio):

        paso {{ item.orden }} ({{ item.accion }}, vía '{{ item.via | default('api') }}')
        {{ item.porque }}

      Lo que falta es el ejecutor de la vía '{{ item.via | default('api') }}'
      {% if (item.via | default('api')) == 'interior' %}para el tipo '{{ item.parametros.tipo }}'{% endif %} (las vías y
      tipos que ya sabe están en `DRIVERS`, en `filter_plugins/interior.py`). Los pasos anteriores a este
      ya se han dado --el plan es idempotente, así que volver a lanzar `apply` cuando
      ese ejecutor exista sigue exactamente desde aquí--, y ninguno posterior se ha
      tocado.
  when:
    - (item.via | default('api')) not in ['api', 'tunnel', 'sonda']
    # El interior se da por despachado SÓLO si su driver existe y lo ha cogido la rama
    # de arriba: lo que no tenga driver cae aquí y para con su nombre.
    - not ((item.via | default('api')) == 'interior'
           and (item.parametros.tipo | default('')) in ['linux', 'routeros'])
