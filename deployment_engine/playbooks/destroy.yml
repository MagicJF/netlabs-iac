---
# PROPÓSITO:   el verbo `destroy`. El ÚNICO que destruye. Borra los invitados del lab,
#              su pool (sólo cuando ya está vacío) y, al final, los BRIDGES que creó
#              este lab y que ya no usa nadie.
# INVARIANTES: el motor NUNCA borra un invitado que no esté en la declaración: si en
#              el pool del lab aparece algo que ningún rol declara, `destroy` se
#              NIEGA y lo dice. Borrar es irreversible; equivocarse no tiene vuelta.
#              El pool se borra el último de los invitados y sólo si ha quedado
#              vacío, para que un fallo a medias no deje invitados huérfanos sin su
#              frontera de propiedad.
#              Un bridge se borra SÓLO con dos pruebas: que su `comments` lleve la
#              marca de ESTE lab (lo escribió el plan al crearlo) y que ningún
#              invitado de fuera del lab lo esté usando. Un bridge sin marca es un
#              bridge del nodo que el lab encontró puesto: no se toca.
# LÍMITES:     borrar un invitado ARRANCADO no se puede: primero hay que pararlo.
#              Parar y borrar son asíncronos, y el motor ESPERA cada tarea sondeando
#              la API (tasks/esperar_tarea.yml) antes de seguir; el pool sólo cae
#              cuando de verdad ha quedado vacío.
#              Borrar un bridge exige recargar la red del nodo (PUT /network), que es
#              la llamada más delicada del motor: se hace UNA vez y sólo si de verdad
#              se ha borrado alguno. Los bridges que el lab encontró puestos y los que
#              ya existían sin marca se conservan, y se dice por qué: limpiarlos es
#              cirugía a mano sobre /etc/network/interfaces, no un verbo del motor.
# VER:         README.md §Cómo se usa; README.md §Los bridges;
#              AGENTS.md §Reglas duras (regla 9)

- name: "DESTROY · borrar los invitados del lab y su pool"
  hosts: proxmox_api
  gather_facts: false
  vars_files:
    - ../vars/engine.yml
  tasks:
    - name: "DESTROY · cargar la declaración del lab"
      ansible.builtin.include_vars:
        file: "{{ pve_archivo_lab }}"
        name: declaracion_cruda

    - name: "DESTROY · validar la coherencia de la declaración"
      ansible.builtin.include_tasks: ../tasks/validar.yml

    - name: "DESTROY · leer el mundo y re-derivar la identidad"
      ansible.builtin.include_tasks: ../tasks/identidad.yml

    - name: "DESTROY · parar si no hay estado del mundo"
      ansible.builtin.fail:
        msg: |-
          No se pudo leer el estado del mundo para el lab '{{ pve_lab }}':
            {{ pve_mundo_error | default('motivo desconocido') }}
          Sin leer la API no se puede saber qué se va a borrar. Y borrar sin saber no
          se hace.
      when: (pve_mundo_error | default('') | length) > 0

    # La comprobación de seguridad: nada en el pool que la declaración no reconozca.
    - name: "DESTROY · comprobar que en el pool no hay nada ajeno"
      ansible.builtin.set_fact:
        informe: "{{ declaracion | estado_verificar(estado, identidad) }}"

    - name: "DESTROY · negarse a borrar lo que no está declarado"
      ansible.builtin.fail:
        msg: |-
          DESTROY CANCELADO para el lab '{{ pve_lab }}'.
          En el pool '{{ pve_lab }}' hay invitados que la declaración NO reconoce:
          {% for sobrante in informe.sobran %}
            - vmid={{ sobrante.vmid }} nombre={{ sobrante.nombre }} rol={{ sobrante.rol }} ({{ sobrante.nota }})
          {% endfor %}
          Este motor nunca borra algo que no haya declarado otra persona. Revísalo a
          mano en Proxmox (o añádelo a la declaración) y vuelve a intentarlo.
      when: (informe.sobran | length) > 0

    - name: "DESTROY · qué se va a borrar"
      ansible.builtin.debug:
        msg: >-
          '{{ pve_lab }}': se borrarán {{ informe.encontrados_en_pool }} invitado(s) del
          pool y, después, el pool si queda vacío.

    # Sólo se borra lo que está EN EL POOL del lab (la frontera de propiedad): un
    # invitado de otro lab jamás entra en esta lista.
    # Cada borrado es asíncrono: el envoltorio espera a que Proxmox confirme la
    # tarea antes de pasar al siguiente. Así el pool se borra cuando de verdad ha
    # quedado vacío, sin una espera fija a ojo.
    # Un invitado ARRANCADO no se puede borrar: Proxmox responde 500 ("container is
    # running"). Se PARA primero -- y parar también es asíncrono, así que se espera.
    # Se filtra por `arrancado` en la propia LISTA, no con un `when` sobre el bucle:
    # un `when` sobre un `include_tasks` con `loop` no se evalúa por elemento.
    - name: "DESTROY · parar cada invitado arrancado (esperando a cada paro)"
      ansible.builtin.include_tasks: ../tasks/pve_api_y_esperar.yml
      vars:
        pve_api_metodo: POST
        pve_api_ruta: "/nodes/{{ item.nodo }}/{{ item.tipo }}/{{ item.vmid }}/status/stop"
        pve_api_etiqueta: "paro del invitado {{ item.vmid }} ({{ item.nombre }})"
      loop: "{{ estado.invitados | dict2items | map(attribute='value') | selectattr('arrancado') | list }}"
      loop_control:
        label: "{{ item.tipo }}/{{ item.vmid }} {{ item.nombre }}"

    - name: "DESTROY · borrar cada invitado del lab (esperando a cada borrado)"
      ansible.builtin.include_tasks: ../tasks/pve_api_y_esperar.yml
      vars:
        pve_api_metodo: DELETE
        # `purge` va en la RUTA (query), no en el cuerpo: Proxmox rechaza un DELETE
        # con cuerpo ("Unexpected content for method 'DELETE'", 501).
        pve_api_ruta: "/nodes/{{ item.nodo }}/{{ item.tipo }}/{{ item.vmid }}?purge=1"
        pve_api_etiqueta: "borrado del invitado {{ item.vmid }} ({{ item.nombre }})"
      loop: "{{ estado.invitados | dict2items | map(attribute='value') | list }}"
      loop_control:
        label: "{{ item.tipo }}/{{ item.vmid }} {{ item.nombre }}"

    - name: "DESTROY · borrar el pool del lab (frontera de propiedad)"
      ansible.builtin.include_tasks: ../tasks/pve_api.yml
      vars:
        pve_api_metodo: DELETE
        pve_api_ruta: "/pools/{{ pve_lab }}"
        pve_api_etiqueta: "el pool del lab, ya vacío"
      when: pve_lab in (estado.pools | default({}))

    # --- Los bridges: del nodo, no del lab --------------------------------------
    # Un bridge no está en ningún pool, así que la frontera de propiedad no sirve
    # aquí: lo único que prueba que lo creó ESTE lab es el `comments` que le escribió
    # el plan al crearlo (`lab=<lab> gestionado por netlabs_v4_b`). Y hay una segunda
    # guarda: que ningún invitado de FUERA del lab lo esté usando. En la duda se
    # conserva, siempre: un bridge huérfano es inerte (sin dirección y sin nadie
    # colgado), uno borrado por error deja sin red a quien lo usaba.
    # Van los ÚLTIMOS, después del pool, porque hasta hace un momento los usaban los
    # invitados del lab: borrarlos antes los dejaría sin red a medio destruir.
    - name: "DESTROY · ¿qué bridges declara este lab y llevan su marca?"
      ansible.builtin.set_fact:
        pve_bridges_candidatos: "{{ declaracion | estado_bridges_candidatos(estado) }}"

    # Sólo se lee la red de los invitados ajenos si hay algo marcado que borrar: si no
    # hay candidatos, esta lista va vacía y no se gasta ni una llamada.
    - name: "DESTROY · leer la red de los invitados que NO son de este lab"
      ansible.builtin.include_tasks: ../tasks/pve_api.yml
      vars:
        pve_api_metodo: GET
        pve_api_ruta: "/nodes/{{ item.nodo }}/{{ item.tipo }}/{{ item.vmid }}/config"
        pve_api_etiqueta: "red del invitado ajeno {{ item.vmid }} ({{ item.rol_o_nombre }}): ¿usa un bridge del lab?"
        pve_api_tolerar_error: true
        pve_api_acumular_configs_ajenas: true
        pve_api_vmid: "{{ item.vmid }}"
      loop: "{{ pve_cluster_recursos | pve_invitados_fuera_del_pool(pve_lab) if (pve_bridges_candidatos | length) > 0 else [] }}"
      loop_control:
        label: "{{ item.tipo }}/{{ item.vmid }} {{ item.rol_o_nombre }}"

    - name: "DESTROY · decidir qué bridges se borran y cuáles se conservan"
      ansible.builtin.set_fact:
        pve_bridges_decision: "{{ declaracion | estado_bridges_a_borrar(estado, pve_configs_ajenas | default({})) }}"

    - name: "DESTROY · borrar los bridges que creó este lab y no usa nadie"
      ansible.builtin.include_tasks: ../tasks/pve_api.yml
      vars:
        pve_api_metodo: DELETE
        pve_api_ruta: "/nodes/{{ estado.nodo }}/network/{{ item }}"
        pve_api_etiqueta: "el bridge {{ item }}: lo creó este lab (lleva su marca) y no lo usa nadie"
      loop: "{{ pve_bridges_decision.borrar }}"
      loop_control:
        label: "{{ item }}"

    # Un bridge borrado sigue ACTIVO hasta que el nodo recarga su red, y recargar es
    # lo más delicado que hace este motor (reescribe la red del nodo): se hace una vez,
    # al final, y sólo si de verdad se ha borrado algo.
    - name: "DESTROY · recargar la red del nodo, una sola vez, para aplicar los borrados"
      ansible.builtin.include_tasks: ../tasks/pve_api_y_esperar.yml
      vars:
        pve_api_metodo: PUT
        pve_api_ruta: "/nodes/{{ estado.nodo }}/network"
        pve_api_etiqueta: "recarga de la red del nodo: un bridge borrado sigue activo hasta recargar"
      when: (pve_bridges_decision.borrar | length) > 0

    - name: "DESTROY · qué ha pasado con los bridges"
      ansible.builtin.debug:
        msg: "{{ pve_bridges_decision | estado_bridges_texto }}"

    - name: "DESTROY · resultado"
      ansible.builtin.debug:
        msg: >-
          '{{ pve_lab }}' destruido: {{ estado.invitados | length }} invitado(s), su pool y
          {{ pve_bridges_decision.borrar | length }} bridge(s) propio(s).
          El diario dice exactamente qué se llamó: {{ pve_carpeta_logs }}/api.jsonl
