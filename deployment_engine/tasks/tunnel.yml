---
# PROPÓSITO:   EL TÚNEL, por el lado del motor. Deja la clave del túnel en su sitio
#              (en su propia máquina y dentro del invitado), le manda UNA vez por la
#              consola el arranque de la salida hacia casa, y COMPRUEBA de punta a
#              punta que el puerto reenviado contesta. Es lo que hace que desde el
#              nodo de control se pueda entrar en la red de un lab (§5).
# INVARIANTES: escribe FUERA del repo en un solo sitio: el `~/.ssh` del nodo de
#              control (su par de claves y UNA línea autorizada con `restrict` y
#              `permitlisten`, que no da shell ni nada más que ese reenvío). Es de su
#              propia máquina, y es idempotente: volver a pasar por aquí deja lo mismo.
#              La clave privada NO viaja en el plan ni se escribe en ningún diario:
#              sólo se usa aquí, para armar el guion, y con `no_log`.
#              Si el túnel no responde, esto PARA diciendo qué pieza falta; nunca lo
#              rodea por otra vía (regla 16).
# LÍMITES:     el invitado tiene que existir y estar arrancado (lo dice el plan, que
#              emite `arrancar_invitado` antes). Si el invitado no tiene dirección en
#              el bridge de gestión del nodo, el túnel no puede salir y se dice.
#              El motor NO toca el hipervisor: ni rutas, ni NAT, ni ficheros suyos.
# VER:         docs/tunnel-del-bastion.md; docs/decisiones/0004-*.md

# Entradas (las pone el paso del plan, nunca un lab):
#   túnel_rol            el rol del invitado que hace de bastión
#   túnel_tipo           lxc | qemu
#   túnel_vmid           su vmid
#   túnel_puerto         el puerto local del nodo de control que el invitado deja
#                         reenviado (se deriva del vmid: nada que guardar)
#   túnel_rest           por cada equipo con el que el motor habla por REST, la interfaz
#                         que este túnel tiene que dejar abierta para llegar a su REST
#                         (puerto 80): {rol, direccion, puerto, puerto_servicio}. Vacío
#                         si el lab no configura ningún RouterOS.
#   túnel_salida_host    a dónde sale (el nodo de control): ENTORNO, de secrets.yml
#   túnel_salida_puerto  por qué puerto sale (443)
#   túnel_usuario        con qué usuario entra en el nodo de control
#   túnel_clave          la ruta de su clave privada del túnel (fuera del repo)
#   túnel_solo_comprobar si es true, no se manda nada por consola: sólo se comprueba
#
# Dos modos de llamada, y el porqué de cada uno:
#   * `túnel_solo_clave: true` -- lo llama el verbo ANTES de calcular el plan, para
#     saber cuál es la clave pública del túnel (el plan la necesita: se inyecta al
#     CREAR el invitado, y después ya no se puede). `túnel_clave_generar` decide si
#     ese verbo puede generarla: `apply` sí (es un verbo de escritura), `plan` y
#     `preflight` NO -- mirar qué haría el motor no debe crear ficheros, ni siquiera
#     en la máquina del motor.
#   * el modo normal -- lo llama `apply` para cada paso del túnel, con el invitado.

- name: "TÚNEL · mirar si el motor ya tiene su par de claves del túnel"
  ansible.builtin.stat:
    path: "{{ tunnel_clave | expanduser }}"
  register: tunnel_clave_estado
  changed_when: false

# El par de claves del túnel lo genera el motor UNA vez, en su propia máquina. No es
# una credencial del lab: es de quien despliega, y por eso vive en su `~/.ssh` y no en
# el repo (regla 3). `plan` y `preflight` no lo generan: mirar no crea nada.
- name: "TÚNEL · generar el par de claves del túnel (sólo la primera vez)"
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - "-t"
      - ed25519
      - "-f"
      - "{{ tunnel_clave | expanduser }}"
      - "-N"
      - ""
      - "-C"
      - "netlabs_v4_b tunnel: no da shell, sólo el reenvío del lab"
  when:
    - not tunnel_clave_estado.stat.exists
    - tunnel_clave_generar | default(true) | bool
  changed_when: true
  no_log: true

- name: "TÚNEL · mirar si ya existe la clave pública del túnel"
  ansible.builtin.stat:
    path: "{{ (tunnel_clave | expanduser) }}.pub"
  register: tunnel_clave_publica_estado
  changed_when: false

- name: "TÚNEL · leer la clave pública del túnel (si ya existe)"
  ansible.builtin.set_fact:
    tunnel_clave_publica: >-
      {{ lookup('file', (tunnel_clave | expanduser) ~ '.pub') | trim
         if tunnel_clave_publica_estado.stat.exists else '' }}
    tunnel_autorizadas: "{{ (tunnel_clave | expanduser) | dirname }}/authorized_keys"
  changed_when: false

- name: "TÚNEL · parar si el lab declara túnel y el motor no tiene clave pública"
  ansible.builtin.fail:
    msg: |-
      El lab '{{ pve_lab }}' declara un túnel (su bastión sale hacia casa),
      pero el motor todavía no tiene su par de claves del túnel en
      {{ tunnel_clave }}. Sin la clave pública no se puede crear el bastión
      --la clave se inyecta AL CREARLO, y después ya no se puede-- así que esto para
      aquí en vez de crear un invitado al que no se podría entrar.
      Lo que lo arregla, y lo hace solo: `./lab --lab {{ pve_lab }} apply` (apply
      genera el par de claves del túnel la primera vez; `plan` y `preflight` no, para
      que mirar no escriba nada).
  when:
    - tunnel_clave_publica | length == 0
    - not (tunnel_solo_clave | default(false) | bool)
# Los puertos que este túnel deja reenviados: el suyo (por el que se le lee la consola y
# por el que entra Ansible) y el REST (80) de cada equipo con el que el motor hablará por
# REST. Se calcula UNA vez y se usa en los DOS sitios que tienen que decir lo mismo --la
# línea autorizada y el guion--, porque una lista escrita dos veces se separa sola.
# OJO con la forma: `permitlisten` se REPITE (`permitlisten="a",permitlisten="b"`); una
# lista dentro de una sola opción hace que sshd no encuentre la clave y conteste un
# «Permission denied» que no explica nada (lo arma `interior_permitlisten`, medido).
- name: "TÚNEL · los puertos que este túnel deja reenviados (la consola y los REST del lab)"
  ansible.builtin.set_fact:
    tunnel_puertos_autorizados: >-
      {{ ([tunnel_puerto]
          + (tunnel_rest | default([]) | map(attribute='puerto') | list))
         | interior_permitlisten }}
  changed_when: false
  when: not (tunnel_solo_clave | default(false) | bool)

# PRIMERO se quitan las líneas viejas de ESTE lab. No es limpieza cosmética: el comentario
# lleva el lab y el puerto, y si el invitado se rehace cambia de vmid y por tanto de puerto;
# una línea vieja con la misma clave taparía la nueva (OpenSSH usa la primera que casa) y el
# túnel se quedaría mudo sin que nada diera error. Solo se tocan las líneas de este lab.
- name: "TÚNEL · quitar las líneas viejas de este lab en el nodo de control (si las hay)"
  ansible.builtin.lineinfile:
    path: "{{ tunnel_autorizadas }}"
    regexp: '^.*netlabs_v4_b-tunnel-{{ pve_lab }}-(?!{{ tunnel_puerto }}$)[0-9]+.*$'
    state: absent
    mode: '0600'
  when: not (tunnel_solo_clave | default(false) | bool)

# Y DESPUÉS la de este puerto, con `restrict` + `port-forwarding` + `permitlisten`: esa clave
# no da shell, no ejecuta comandos, no abre túneles que no sean este reenvío concreto. El
# `regexp` hace que volver a pasar por aquí deje la MISMA línea en su sitio, no una más.
- name: "TÚNEL · autorizar SÓLO los reenvíos de este túnel en el nodo de control"
  ansible.builtin.lineinfile:
    path: "{{ tunnel_autorizadas }}"
    regexp: '^.*netlabs_v4_b-tunnel-{{ pve_lab }}-{{ tunnel_puerto }}.*$'
    line: >-
      restrict,port-forwarding,{{ tunnel_puertos_autorizados }} {{ tunnel_clave_publica }}
      netlabs_v4_b-tunnel-{{ pve_lab }}-{{ tunnel_puerto }}
    create: true
    mode: '0600'
    insertafter: EOF
    state: present
  when: not (tunnel_solo_clave | default(false) | bool)

# Lo que el invitado va a ejecutar, armado aquí y sólo aquí. `no_log` porque el guion
# lleva dentro la clave privada: no se imprime, ni se diaria, ni se guarda.
- name: "TÚNEL · armar la línea que se manda por consola (una sola, en base64)"
  ansible.builtin.set_fact:
    tunnel_linea: >-
      {{ (lookup('file', tunnel_clave | expanduser)
          | interior_guion_tunnel(tunnel_salida_host, tunnel_salida_puerto,
                                  tunnel_usuario, tunnel_puerto, tunnel_rest | default([]))
          | interior_linea_consola) | b64encode }}
    # `interior_marca_túnel` es un FILTRO: se llama con `|` aunque no necesite
    # entrada (una marca fija). Escribirlo como variable da «undefined», que es
    # exactamente lo que pasó la primera vez.
    tunnel_marca_ok: "{{ '' | interior_marca_tunnel }}"
    tunnel_marca_fallo: "CONSOLA_FALLO_NETLABS"
  when:
    - not (tunnel_solo_comprobar | default(false) | bool)
    - not (tunnel_solo_clave | default(false) | bool)
  changed_when: false
  no_log: true

# La consola: UNA línea, pero no una sola tentativa. Hasta que el invitado no lleva unos
# segundos arrancado su consola no da shell, y entonces la línea se pierde sin ruido (el
# terminal devuelve el eco, no la salida). Como el guion es idempotente, reintentar la
# MISMA línea es seguro y es lo único que hace falta para que esto no sea una lotería.
- name: "TÚNEL · dar por no enviado el arranque (el primer intento siempre se hace)"
  ansible.builtin.set_fact:
    tunnel_consola_rc: 1
  changed_when: false
  when:
    - not (tunnel_solo_comprobar | default(false) | bool)
    - not (tunnel_solo_clave | default(false) | bool)

- name: "TÚNEL · mandar el arranque del túnel por la consola del invitado"
  ansible.builtin.include_tasks: ../tasks/console.yml
  loop: "{{ range(1, (engine_tunnel_intentos | int) + 1) | list }}"
  loop_control:
    loop_var: tunnel_consola_intento
    label: "intento {{ tunnel_consola_intento }}"
  # Sólo se vuelve a intentar si el intento anterior NO trajo la marca de éxito. El
  # `default(1)` no es adorno: esta misma tarea se incluye ANTES de planificar (con
  # `túnel_solo_clave`), y ahí la variable todavía no existe -- preguntar por ella sin
  # red es un error, no un `no`.
  when:
    - (tunnel_consola_rc | default(1) | int) != 0
    - not (tunnel_solo_comprobar | default(false) | bool)
    - not (tunnel_solo_clave | default(false) | bool)
  vars:
    tunnel_consola_tipo: "{{ tunnel_tipo }}"
    tunnel_consola_vmid: "{{ tunnel_vmid }}"
    tunnel_consola_linea: "{{ tunnel_linea }}"
    tunnel_consola_marca_ok: "{{ tunnel_marca_ok }}"
    tunnel_consola_marca_fallo: "{{ tunnel_marca_fallo }}"
    tunnel_consola_etiqueta: "arranque del túnel del rol {{ tunnel_rol }} (intento {{ tunnel_consola_intento }})"

# LA PRUEBA DE PUNTA A PUNTA: si el puerto reenviado del nodo de control contesta, la
# cadena entera funciona (nodo de control -> 443 -> puesto -> vuelta). No hay forma de
# fingirlo: el puerto sólo contesta si el túnel está arriba.
- name: "TÚNEL · esperar a que conteste el puerto {{ tunnel_puerto }} (la cadena entera)"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ tunnel_puerto }}"
    delay: "{{ engine_tunnel_retardo }}"
    timeout: "{{ engine_tunnel_espera }}"
    state: started
  register: tunnel_puerto_estado
  failed_when: false
  changed_when: false
  when: not (tunnel_solo_clave | default(false) | bool)

- name: "TÚNEL · parar si el puerto reenviado no contesta"
  ansible.builtin.fail:
    msg: |-
      El túnel del lab '{{ pve_lab }}' NO está en pie: el invitado {{ tunnel_vmid }}
      (rol '{{ tunnel_rol }}') no ha dejado reenviado el puerto {{ tunnel_puerto }} del
      nodo de control, así que desde aquí no se puede entrar en la red del lab.
      Lo que se intentó, en orden: generar el par de claves del túnel, autorizar el
      reenvío en `{{ tunnel_autorizadas }}`, mandar el arranque por la consola del
      invitado y esperar el puerto. El diario de la consola está en
      {{ pve_carpeta_logs }}/console.jsonl.
      Causas medidas y qué mirar:
        - el invitado está parado: `apply` lo arranca antes de llegar aquí (paso
          `arrancar_invitado`); si se paró a mano, vuelve a lanzar `apply`;
        - el invitado no alcanza el nodo de control: su interfaz en el bridge de gestión
          del nodo tiene que tener dirección y salida;
        - el guion se mandó pero el sshd del nodo de control rechaza la clave: mira el
          `eco` de la última línea de {{ pve_carpeta_logs }}/console.jsonl.
      El motor NO rodea esto por ninguna otra vía (regla 16).
  when:
    - not (tunnel_solo_clave | default(false) | bool)
    - tunnel_puerto_estado is failed or not (tunnel_puerto_estado.state | default('') == 'started')

- name: "TÚNEL · el túnel del rol '{{ tunnel_rol }}' está en pie"
  ansible.builtin.debug:
    msg: >-
      túnel del lab '{{ pve_lab }}': el puerto {{ tunnel_puerto }} del nodo de control
      contesta, así que la cadena nodo de control -> {{ tunnel_salida_host }}:{{ tunnel_salida_puerto }}
      -> rol '{{ tunnel_rol }}' -> vuelta funciona. Ansible puede entrar en el lab.
  changed_when: false
  when: not (tunnel_solo_clave | default(false) | bool)
