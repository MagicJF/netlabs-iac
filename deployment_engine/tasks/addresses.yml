---
# PROPÓSITO:   saber qué direcciones están YA EN USO en la red del nodo, preguntándole
#              a cada invitado las que tiene puestas: a un contenedor, su propia API; a
#              una VM, su AGENTE DE INVITADO. Es la pregunta que permite elegir una
#              dirección LIBRE para la interfaz de gestión del bastión (§5) sin
#              guardar ninguna lista (regla 11: nada derivado se guarda en el repo; se
#              vuelve a derivar cada vez).
# INVARIANTES: todo se lee por la PUERTA (`tasks/pve_api.yml`), así que cada lectura
#              deja su línea en el diario. No se escribe nada. Un invitado ilegible NO
#              se ignora en silencio: se diaria el error y el motor sigue, porque una
#              dirección de gestión que se creía libre es un fallo; el informe lo dice.
#              Las direcciones de los bridges del nodo (las vías de acceso de cada subred)
#              vienen ya dentro del estado, de `GET /nodes/<nodo>/network`.
# LÍMITES:     la lectura de una VM es más pobre que la de un contenedor y depende de
#              dos cosas que pueden no darse: que la VM naciera con agente (el canal
#              aparece al arrancar, así que una VM anterior no lo tiene) y que el token
#              tenga `VM.GuestAgent.Audit` en la ACL del nodo. Cuando falla, se TOLERA y
#              el motor se queda como estaba: contando por ARRIBA (`.254`, `.253`…) para
#              no pisar lo que no ve. Lo que no se puede saber, se dice; no se finge.
# VER:         docs/decisiones/0011-el-agente-de-invitado.md;
#              docs/tunnel-del-bastion.md; AGENTS.md §Reglas duras (11, 12)

# Los CONTENEDORES: declaran sus interfaces a la API y se leen sin más. Se mira TODO el
# clúster (no sólo este lab), porque cualquier invitado del nodo puede tener una
# dirección en el bridge de gestión.
- name: "DIRECCIONES · preguntar a cada contenedor del nodo qué direcciones tiene"
  ansible.builtin.include_tasks: pve_api.yml
  vars:
    pve_api_metodo: GET
    pve_api_ruta: "/nodes/{{ item.nodo }}/lxc/{{ item.vmid }}/interfaces"
    pve_api_etiqueta: "direcciones en uso por el contenedor {{ item.vmid }} ({{ item.nombre }})"
    pve_api_tolerar_error: true
    pve_api_acumular_interfaces: true
    pve_api_vmid: "{{ item.vmid }}"
  loop: "{{ pve_cluster_recursos | pve_contenedores_cluster
             if (pve_estado_fixture | default('') | length) == 0 else [] }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.nombre | default('') }}"

# Las VMs: su config NO lleva `ip=` (lo pone el invitado por dentro) y no hay endpoint
# de interfaces para VMs, así que la única forma de saberlo es preguntárselo a ella por
# su AGENTE DE INVITADO. Va en su propio bucle porque la lectura es DISTINTA --y más
# frágil: el error se tolera igual, y una VM sin agente simplemente no contesta (ADR
# 0011)-- pero el resultado acaba en el mismo saco que el de los contenedores.
- name: "DIRECCIONES · preguntar a cada VM del nodo por el agente de invitado"
  ansible.builtin.include_tasks: pve_api.yml
  vars:
    pve_api_metodo: GET
    pve_api_ruta: "/nodes/{{ item.nodo }}/qemu/{{ item.vmid }}/agent/network-get-interfaces"
    pve_api_etiqueta: "direcciones en uso por la VM {{ item.vmid }} ({{ item.nombre }}), por su agente"
    pve_api_tolerar_error: true
    pve_api_acumular_interfaces: true
    pve_api_vmid: "{{ item.vmid }}"
  loop: "{{ pve_cluster_recursos | pve_vms_cluster
             if (pve_estado_fixture | default('') | length) == 0 else [] }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.nombre | default('') }}"

# Y se meten en el estado del mundo. La conversión (qué es «una dirección en uso», con
# las DOS formas de lectura que hay) es una función pura de `estado.py`, no Jinja: se
# prueba con fixtures, sin Proxmox.
- name: "DIRECCIONES · meter las direcciones en uso en el estado del mundo"
  ansible.builtin.set_fact:
    estado: "{{ estado | estado_con_direcciones(pve_interfaces | default({})) }}"
